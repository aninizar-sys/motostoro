<style>

    --negro2: #151515;

    --rojo: #e3242b;
    --rojo-dim: #7a1418;
    --carbon: #8a8a8a;
    --carbon-claro: #b8b8b8;
    --blanco: #f5f5f5;
    --verde: #3aa65b;
    --borde: #2a2a2a;

  body{background:var(--negro); color:var(--blanco); min-height:100vh;}
  ::-webkit-scrollbar{width:8px; height:8px;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 20%, #1a0a0a 0%, #0a0a0a 70%);

  .login-box{

    padding:40px 36px; width:340px; max-width:88vw; text-align:center;

  .login-box h1 span{color:var(--rojo);}

  .login-box input{
    width:100%; padding:12px 14px; margin-bottom:12px; background:var(--negro3);
    border:1px solid var(--borde); border-radius:8px; color:var(--blanco); font-size:14px;
  }

    background:var(--rojo); color:#fff; border:none; padding:12px 18px; border-radius:8px;

  #app{display:none; min-height:100vh; grid-template-columns:220px 1fr; display:grid;}
  aside{
    background:var(--negro2); border-right:1px solid var(--borde);

  .logo-mini{padding:0 20px 20px; border-bottom:1px solid var(--borde); margin-bottom:16px;}
  .logo-mini div{font-size:20px; font-weight:800; letter-spacing:1px;}
  .logo-mini span{color:var(--rojo);}
  .logo-mini small{display:block; color:var(--carbon); font-size:11px; margin-top:4px;}
  nav{flex:1;}
  nav button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:var(--carbon-claro); padding:12px 20px;
    font-size:14px; cursor:pointer; border-left:3px solid transparent;
  }
  nav button:hover{background:var(--negro3); color:var(--blanco);}
  nav button.activo{background:var(--negro3); color:#fff; border-left-color:var(--rojo);}
  .sidebar-footer{padding:14px 20px; border-top:1px solid var(--borde);}
  .sidebar-footer .user{font-size:13px; color:var(--blanco); margin-bottom:2px;}
  .sidebar-footer .sede{font-size:12px; color:var(--rojo);}
  .sidebar-footer button{margin-top:10px; font-size:12px; color:var(--carbon); background:none; border:none; cursor:pointer; text-decoration:underline;}

  main{padding:28px 34px; overflow-y:auto; max-height:100vh;}
  header.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}
  header.topbar h2{font-size:22px;}
  .sede-selector{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--carbon);}
  .sede-selector select{
    background:var(--negro3); color:var(--blanco); border:1px solid var(--borde);
    padding:6px 10px; border-radius:6px; font-size:13px;
  }

  .card{background:var(--negro2); border:1px solid var(--borde); border-radius:12px; padding:20px; margin-bottom:20px;}
  .card h3{font-size:15px; margin-bottom:14px; color:var(--carbon-claro); text-transform:uppercase; letter-spacing:.5px;}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:20px;}
  .kpi{background:var(--negro2); border:1px solid var(--borde); border-radius:12px; padding:18px;}
  .kpi .label{font-size:12px; color:var(--carbon); text-transform:uppercase; letter-spacing:.5px;}
  .kpi .valor{font-size:24px; font-weight:700; margin-top:6px;}
  .kpi.rojo .valor{color:var(--rojo);}
  .kpi.verde .valor{color:var(--verde);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--carbon); font-weight:600; padding:10px 8px; border-bottom:1px solid var(--borde); text-transform:uppercase; font-size:11px; letter-spacing:.4px;}

  .badge.pendiente{background:#3a2020; color:#e87070;}
  .badge.pagada_parcial{background:#3a3520; color:#e8d070;}
  .badge.pagada_completa{background:#1d3b26; color:var(--verde);}
  .badge.anulada{background:#333; color:#888;}
  .badge.aceptado{background:#1d3b26; color:var(--verde);}
  .badge.rechazado, .badge.cancelado{background:#333; color:#888;}

  .form-row{margin-bottom:14px;}
  .form-row label{display:block; font-size:12px; color:var(--carbon); margin-bottom:6px;}
  .form-row input, .form-row select, .form-row textarea{

/* =========================================================
   LOGIN / SESIÓN
========================================================= */
async function hacerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errDiv = document.getElementById('login-error');
  errDiv.textContent = '';
  const btn = document.getElementById('btn-login');
  if(!email || !pass){ errDiv.textContent = 'Ingresa correo y contraseña.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Entrar';

  if(error){
    errDiv.textContent = 'Correo o contraseña incorrectos.';
    return;
  }
  await cargarSesion();
}

async function cerrarSesion(){
  await sb.auth.signOut();
  location.reload();
}

async function cargarSesion(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ mostrarLogin(); return; }
  ESTADO.usuario = user;

  const { data: perfil, error } = await sb.from('perfiles').select('*').eq('id', user.id).single();
  if(error || !perfil){
    document.getElementById('login-error').textContent = 'Tu usuario no tiene un perfil asignado. Contacta al administrador.';
    mostrarLogin();
    return;
  }
  if(!perfil.activo){
    document.getElementById('login-error').textContent = 'Tu cuenta está desactivada.';
    mostrarLogin();
    return;
  }
  ESTADO.perfil = perfil;

  const { data: sedes } = await sb.from('sedes').select('*').eq('activa', true).order('nombre');
  ESTADO.sedes = sedes || [];

  if(perfil.rol === 'admin_general'){
    ESTADO.sedeSeleccionada = ESTADO.sedes[0]?.id || null;
  } else {
    ESTADO.sedeSeleccionada = perfil.sede_id;
  }

  mostrarApp();
}

function mostrarLogin(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function mostrarApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'grid';

  document.getElementById('footer-user').textContent = ESTADO.perfil.nombre_completo;
  const sedeActual = ESTADO.sedes.find(s => s.id === ESTADO.sedeSeleccionada);
  document.getElementById('footer-sede').innerHTML = ESTADO.perfil.rol === 'admin_general'
    ? 'Administrador general'
    : (sedeActual ? `${sedeActual.nombre}${sedeActual.razon_social ? `<br><span style="color:var(--carbon); font-size:11px;">${sedeActual.razon_social}</span>` : ''}` : '');

  const wrap = document.getElementById('sede-selector-wrap');
  if(ESTADO.perfil.rol === 'admin_general' && ESTADO.sedes.length){
    wrap.style.display = 'flex';
    const sel = document.getElementById('sede-selector');
    sel.innerHTML = ESTADO.sedes.map(s => `<option value="${s.id}">${s.nombre}</option>`).join('');
    sel.value = ESTADO.sedeSeleccionada;
  } else {
    wrap.style.display = 'none';
  }

  document.getElementById('nav-caja-matriz').style.display = ESTADO.perfil.rol === 'admin_general' ? 'block' : 'none';

  document.querySelectorAll('#nav-menu button').forEach(btn=>{
    btn.onclick = () => cambiarTab(btn.dataset.tab);
  });

  cambiarTab('ventas');
}

function cambiarSedeSeleccionada(sedeId){
  ESTADO.sedeSeleccionada = sedeId;

  }[tab];

/* Similitud de texto (coeficiente de Dice sobre bigramas) para emparejar nombres de producto */
function normalizarTexto(t){
  return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();
}
function bigramas(t){
  const s = normalizarTexto(t);
  const out = [];
  for(let i=0; i<s.length-1; i++) out.push(s.substring(i,i+2));
  return out;
}
function similitud(a, b){
  const ba = bigramas(a), bb = bigramas(b);
  if(!ba.length || !bb.length) return 0;
  let interseccion = 0;
  const copia = [...bb];
  for(const bg of ba){
    const idx = copia.indexOf(bg);
    if(idx !== -1){ interseccion++; copia.splice(idx,1); }
  }
  return (2 * interseccion) / (ba.length + bb.length);
}
function mejorMatchProducto(nombre, codigo){
  // 1) Match exacto por código/SKU si viene en la factura y coincide con algún producto
  if(codigo){
    const codigoNormalizado = normalizarTexto(codigo);
    const porCodigo = ESTADO.productos.find(p => p.sku && normalizarTexto(p.sku) === codigoNormalizado);
    if(porCodigo) return { producto: porCodigo, score: 1, porCodigo: true };
  }
  // 2) Si no hay match por código, similitud de nombre
  let mejor = null, mejorScore = 0;
  for(const p of ESTADO.productos){
    const score = similitud(nombre, p.nombre);
    if(score > mejorScore){ mejorScore = score; mejor = p; }
  }
  return mejorScore >= 0.5 ? { producto: mejor, score: mejorScore, porCodigo: false } : null;
}

  return `
    <div class="inline-2">
      <div class="form-row" style="margin-bottom:0;">
        <label>Moneda recibida/pagada</label>
        <select id="${prefix}-moneda" onchange="actualizarMetodosGenerico('${prefix}')">
          <option value="USD">Dólares (USD)</option>
          <option value="COP">Pesos colombianos (COP)</option>
          <option value="VES">Bolívares (VES)</option>
        </select>
      </div>
      <div class="form-row" style="margin-bottom:0;">
        <label>Forma de pago</label>
        <select id="${prefix}-metodo"></select>
      </div>
    </div>
    <div class="form-row" id="${prefix}-tasa-wrap" style="display:none;">
      <label>Tasa de cambio (1 USD = X)</label>
      <input type="number" id="${prefix}-tasa" min="0" step="0.01">
      <div class="stock" id="${prefix}-equivale"></div>
    </div>
  `;
}

function actualizarMetodosGenerico(prefix){
  const monedaEl = document.getElementById(`${prefix}-moneda`);
  if(!monedaEl) return;
  const moneda = monedaEl.value;
  document.getElementById(`${prefix}-metodo`).innerHTML = METODOS_POR_MONEDA[moneda].map(m=>`<option value="${m}">${m}</option>`).join('');
  const tasaWrap = document.getElementById(`${prefix}-tasa-wrap`);
  if(tasaWrap) tasaWrap.style.display = moneda === 'USD' ? 'none' : 'block';
}

// Lee moneda/método/tasa de un bloqueMoneda(prefix) y calcula el monto en esa moneda
// a partir del monto ya definido en USD por la lógica de negocio (venta, gasto, abono, etc.)
function datosMonedaCaja(prefix, montoUsd){
  const moneda = document.getElementById(`${prefix}-moneda`)?.value || 'USD';
  const metodo = document.getElementById(`${prefix}-metodo`)?.value || 'Efectivo';
  let tasa = null, montoOriginal = montoUsd;
  if(moneda !== 'USD'){
    tasa = parseFloat(document.getElementById(`${prefix}-tasa`)?.value);
    if(!tasa || tasa <= 0) return { error: 'Ingresa la tasa de cambio.' };
    montoOriginal = montoUsd * tasa;
  }
  return { moneda, metodo, tasa, montoOriginal };
}

// Selector de "¿desde qué caja sale/entra este dinero?" — solo tiene sentido para admin_general,
// que puede elegir entre la caja de la sede que está viendo o la Caja Matriz.
function bloqueOrigenCaja(prefix){
  if(ESTADO.perfil?.rol !== 'admin_general') return '';
  return `
    <div class="form-row">
      <label>¿Desde/hacia qué caja es este pago?</label>
      <select id="${prefix}-origen-caja">
        <option value="sede">Caja de ${sedeNombre(ESTADO.sedeSeleccionada)}</option>
        <option value="matriz">Caja Matriz</option>
      </select>
    </div>
  `;
}

// Devuelve la caja (y el sede_id a usar en movimientos_caja) según lo elegido en bloqueOrigenCaja.
// Si el bloque no existe (no es admin_general), siempre usa la caja de la sede actual.
async function obtenerCajaOrigen(prefix){
  const sel = document.getElementById(`${prefix}-origen-caja`);
  if(sel && sel.value === 'matriz'){
    const { data: caja } = await sb.from('cajas').select('*').is('sede_id', null).single();
    return { caja, sede_id: null };
  }
  const { data: caja } = await sb.from('cajas').select('*').eq('sede_id', ESTADO.sedeSeleccionada).single();
  return { caja, sede_id: ESTADO.sedeSeleccionada };
}

async function cargarProductosYClientes(){
  const { data: productos } = await sb.from('productos').select('*').eq('activo', true).order('nombre');
  ESTADO.productos = productos || [];
  const { data: clientes } = await sb.from('clientes').select('*').order('nombre_completo');
  ESTADO.clientes = clientes || [];

  const { data: invRows } = await sb.from('inventario').select('*').eq('sede_id', ESTADO.sedeSeleccionada);
  ESTADO.inventarioSede = {};
  (invRows||[]).forEach(r => ESTADO.inventarioSede[r.producto_id] = r.cantidad);
}

function buscarProductoInput(txt){
  const lista = document.getElementById('lista-productos');
  const t = txt.toLowerCase().trim();
  let results;
  if(!t){
    // Sin texto: mostrar todo el inventario con stock disponible en esta sede
    results = ESTADO.productos
      .filter(p => (ESTADO.inventarioSede[p.id] ?? 0) > 0)
      .sort((a,b) => a.nombre.localeCompare(b.nombre))
      .slice(0, 30);
  } else {
    results = ESTADO.productos.filter(p =>
      p.nombre.toLowerCase().includes(t) || (p.sku||'').toLowerCase().includes(t)
    ).slice(0,15);
  }
  if(!results.length){ lista.innerHTML = `<div>Sin productos con stock en esta sede. Ve a Inventario para cargar stock.</div>`; lista.style.display='block'; return; }
  lista.innerHTML = results.map(p => `
    <div onclick="agregarProductoAVenta('${p.id}')">
      ${p.nombre} — ${money(p.precio)}
      <div class="stock">Stock en esta sede: ${ESTADO.inventarioSede[p.id] ?? 0}</div>
    </div>
  `).join('');
  lista.style.display = 'block';
}

function agregarProductoAVenta(productoId){
  const producto = ESTADO.productos.find(p=>p.id===productoId);
  if(!producto) return;
  const existente = ESTADO.carritoVenta.find(l=>l.producto_id===productoId);
  if(existente){ existente.cantidad += 1; }
  else {
    ESTADO.carritoVenta.push({
      producto_id: producto.id, nombre: producto.nombre,
      precio_unitario: Number(producto.precio), cantidad: 1
    });
  }
  document.getElementById('buscar-producto').value = '';
  document.getElementById('lista-productos').style.display = 'none';
  renderLineasVenta();
}

function filtrarVentasPorModalidad(modalidad, btn){
  document.querySelectorAll('#filtro-modalidad-ventas button').forEach(b=>b.classList.remove('activo'));
  btn.classList.add('activo');
  document.querySelectorAll('#tbody-ventas tr[data-modalidad]').forEach(tr=>{
    tr.style.display = (modalidad === 'todas' || tr.dataset.modalidad === modalidad) ? '' : 'none';
  });
}

function renderLineasVenta(){
  const div = document.getElementById('lineas-venta');
  if(!ESTADO.carritoVenta.length){
    div.innerHTML = `<div class="empty">Agrega productos a la venta</div>`;
  } else {
    div.innerHTML = ESTADO.carritoVenta.map((l,i)=>`
      <div class="linea-item">
        <div>${l.nombre}</div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:11px; color:var(--carbon);">Cant.</span>
          <input type="number" min="1" value="${l.cantidad}" style="width:50px; padding:5px; background:var(--negro3); border:1px solid var(--borde); border-radius:6px; color:#fff;"
            onchange="cambiarCantidad(${i}, this.value)">
          <span style="font-size:11px; color:var(--carbon);">Precio</span>
          <input type="number" min="0" step="0.01" value="${l.precio_unitario}" style="width:75px; padding:5px; background:var(--negro3); border:1px solid var(--borde); border-radius:6px; color:#fff;"
            onchange="cambiarPrecioLinea(${i}, this.value)">
          <span style="min-width:70px; text-align:right;">${money(l.precio_unitario * l.cantidad)}</span>
          <span class="quitar" onclick="quitarLinea(${i})">✕</span>
        </div>
      </div>
    `).join('');
  }
  const total = ESTADO.carritoVenta.reduce((s,l)=>s + l.precio_unitario*l.cantidad, 0);
  document.getElementById('total-venta').textContent = money(total);
}

function cambiarCantidad(i, val){
  ESTADO.carritoVenta[i].cantidad = Math.max(1, parseFloat(val)||1);
  renderLineasVenta();
}
function cambiarPrecioLinea(i, val){
  ESTADO.carritoVenta[i].precio_unitario = Math.max(0, parseFloat(val)||0);
  renderLineasVenta();
}
function quitarLinea(i){
  ESTADO.carritoVenta.splice(i,1);
  renderLineasVenta();
}

function onModalidadChange(){
  const modalidad = document.getElementById('modalidad-venta').value;
  const esCredito = modalidad !== 'contado';
  document.getElementById('abono-inicial-wrap').style.display = esCredito ? 'block' : 'none';
  document.getElementById('label-cliente-venta').textContent = esCredito ? 'Cliente (obligatorio para esta modalidad)' : 'Cliente (opcional en ventas de contado)';
}

function buscarClienteInput(txt){
  document.getElementById('cliente-id-seleccionado').value = '';
  const lista = document.getElementById('lista-clientes');
  if(!txt.trim()){ lista.style.display='none'; return; }
  const t = txt.toLowerCase();
  const results = ESTADO.clientes.filter(c => c.nombre_completo.toLowerCase().includes(t)).slice(0,8);
  let html = results.map(c => `<div onclick="seleccionarCliente('${c.id}','${c.nombre_completo.replace(/'/g,"\\'")}')">${c.nombre_completo}</div>`).join('');
  html += `<div style="color:var(--rojo);" onclick="crearClienteRapido('${txt.replace(/'/g,"\\'")}')">+ Crear cliente nuevo: "${txt}"</div>`;
  lista.innerHTML = html;
  lista.style.display = 'block';
}

function seleccionarCliente(id, nombre){
  document.getElementById('cliente-id-seleccionado').value = id;
  document.getElementById('buscar-cliente').value = nombre;
  document.getElementById('lista-clientes').style.display = 'none';
}

async function crearClienteRapido(nombre){
  if(!nombre.trim()) return;
  const { data, error } = await sb.from('clientes').insert({ nombre_completo: nombre.trim() }).select().single();
  if(error){ alert('Error creando cliente: ' + error.message); return; }
  ESTADO.clientes.push(data);
  seleccionarCliente(data.id, data.nombre_completo);
}

async function registrarVenta(){
  const msg = document.getElementById('venta-msg');
  msg.innerHTML = '';
  if(!ESTADO.carritoVenta.length){ msg.innerHTML = `<div class="msg err">Agrega al menos un producto.</div>`; return; }

  const modalidad = document.getElementById('modalidad-venta').value;
  const total = ESTADO.carritoVenta.reduce((s,l)=>s + l.precio_unitario*l.cantidad, 0);
  const esCredito = modalidad !== 'contado';
  let clienteId = null;
  let abonoInicial = 0;

  if(esCredito){
    clienteId = document.getElementById('cliente-id-seleccionado').value;
    if(!clienteId){ msg.innerHTML = `<div class="msg err">Selecciona o crea un cliente para esta modalidad.</div>`; return; }
    abonoInicial = parseFloat(document.getElementById('abono-inicial').value) || 0;
    if(abonoInicial > total){ msg.innerHTML = `<div class="msg err">El abono inicial no puede ser mayor al total.</div>`; return; }
  }

  // Validar stock
  for(const l of ESTADO.carritoVenta){
    const stock = ESTADO.inventarioSede[l.producto_id] ?? 0;
    if(l.cantidad > stock){
      msg.innerHTML = `<div class="msg err">Stock insuficiente de "${l.nombre}" en esta sede (disponible: ${stock}).</div>`;
      return;
    }
  }

  const montoParaCajaValidar = esCredito ? abonoInicial : total;
  let pago = null;
  if(montoParaCajaValidar > 0){
    pago = datosMonedaCaja('vt', montoParaCajaValidar);
    if(pago.error){ msg.innerHTML = `<div class="msg err">${pago.error}</div>`; return; }
  }

  const estadoVenta = !esCredito ? 'pagada_completa' : (abonoInicial >= total ? 'pagada_completa' : (abonoInicial > 0 ? 'pagada_parcial' : 'pendiente'));

  const { data: venta, error: errVenta } = await sb.from('ventas').insert({
    sede_id: ESTADO.sedeSeleccionada,
    cliente_id: clienteId,
    modalidad,
    estado: estadoVenta,
    total,
    monto_pagado: esCredito ? abonoInicial : total,
    created_by: ESTADO.perfil.id
  }).select().single();

  if(errVenta){ msg.innerHTML = `<div class="msg err">Error: ${errVenta.message}</div>`; return; }

  // Items
  const items = ESTADO.carritoVenta.map(l => ({
    venta_id: venta.id, producto_id: l.producto_id, cantidad: l.cantidad,
    precio_unitario: l.precio_unitario, subtotal: l.precio_unitario*l.cantidad
  }));
  await sb.from('venta_items').insert(items);

  // Descontar inventario + movimientos
  for(const l of ESTADO.carritoVenta){
    const nuevaCantidad = (ESTADO.inventarioSede[l.producto_id]||0) - l.cantidad;
    await sb.from('inventario').update({ cantidad: nuevaCantidad, updated_at: new Date().toISOString() })
      .eq('sede_id', ESTADO.sedeSeleccionada).eq('producto_id', l.producto_id);
    await sb.from('movimientos_inventario').insert({
      sede_id: ESTADO.sedeSeleccionada, producto_id: l.producto_id, tipo: 'salida_venta',
      cantidad: l.cantidad, referencia_id: venta.id, created_by: ESTADO.perfil.id
    });
  }

  // Caja
  const { data: caja } = await sb.from('cajas').select('*').eq('sede_id', ESTADO.sedeSeleccionada).single();
  const montoParaCaja = esCredito ? abonoInicial : total;
  if(caja && montoParaCaja > 0){
    await sb.from('movimientos_caja').insert({
      caja_id: caja.id, sede_id: ESTADO.sedeSeleccionada,
      tipo: esCredito ? 'ingreso_abono' : 'ingreso_venta', monto: montoParaCaja,
      moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
      descripcion: esCredito ? 'Abono inicial de venta a crédito' : 'Venta de contado',
      referencia_id: venta.id, created_by: ESTADO.perfil.id
    });
    await sb.from('cajas').update({ saldo_actual: Number(caja.saldo_actual) + montoParaCaja }).eq('id', caja.id);
  }

  // Cuenta por cobrar si aplica
  if(esCredito && estadoVenta !== 'pagada_completa'){
    const { data: cxc } = await sb.from('cuentas_por_cobrar').insert({
      venta_id: venta.id, sede_id: ESTADO.sedeSeleccionada, cliente_id: clienteId,
      monto_total: total, saldo_pendiente: total - abonoInicial, estado: estadoVenta
    }).select().single();

    if(abonoInicial > 0 && cxc){
      await sb.from('abonos').insert({
        cuenta_por_cobrar_id: cxc.id, monto: abonoInicial, nota: 'Abono inicial al momento de la venta',
        created_by: ESTADO.perfil.id
      });
    }
  }

  msg.innerHTML = `<div class="msg ok">Venta registrada correctamente.</div>`;
  renderVentas();
}

let MOTOSAN_GRUPO_ACTIVO = null;

async function renderMotosan(){
  const cont = document.getElementById('contenido-tab');

        <div id="motosan-grupo-msg"></div>
        <div class="form-row"><label>Nombre del grupo</label><input type="text" id="mg-nombre" placeholder="Ej: Motosán Julio 2026"></div>
        <div class="form-row"><label>Cantidad total de semanas (igual para todos los participantes)</label><input type="number" id="mg-semanas" min="1" step="1" placeholder="Ej: 20"></div>
        <div class="stock">El grupo es general para toda la empresa. Cada participante elige a qué sede pertenece — de ahí se recoge su pago semanal.</div>

      </div>

      <div class="card">
        <h3>Grupos activos (todas las sedes)</h3>
        <table>
          <thead><tr><th>Grupo</th><th>Semanas totales</th><th></th></tr></thead>
          <tbody>
            ${(grupos||[]).map(g=>`
              <tr>

                <td>${g.semanas_totales}</td>
                <td><button class="btn chico" onclick="abrirGrupoMotosan('${g.id}')">Gestionar</button></td>
              </tr>
            `).join('') || `<tr><td colspan="3" class="empty">No hay grupos Motosán creados aún</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div id="motosan-detalle"></div>

async function crearGrupoMotosan(){
  const msg = document.getElementById('motosan-grupo-msg');
  const nombre = document.getElementById('mg-nombre').value.trim();
  const semanas_totales = parseInt(document.getElementById('mg-semanas').value);

  if(!nombre || !semanas_totales){
    msg.innerHTML = `<div class="msg err">Completa nombre y cantidad de semanas.</div>`; return;
  }

  const { data, error } = await sb.from('motosan_grupos').insert({
    nombre, semanas_totales, created_by: ESTADO.perfil.id
  }).select().single();
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }
  msg.innerHTML = `<div class="msg ok">Grupo creado. Ahora agrega las motos disponibles abajo.</div>`;
  await renderMotosan();
  abrirGrupoMotosan(data.id);
}

async function abrirGrupoMotosan(grupoId){
  MOTOSAN_GRUPO_ACTIVO = grupoId;
  const detalle = document.getElementById('motosan-detalle');
  detalle.innerHTML = `<div class="empty">Cargando grupo...</div>`;

  const { data: grupo } = await sb.from('motosan_grupos').select('*').eq('id', grupoId).single();
  const { data: motosGrupo } = await sb.from('motosan_grupo_motos').select('*, productos(nombre, precio)').eq('grupo_id', grupoId).order('created_at');
  const { data: participantes } = await sb.from('motosan_participantes')
    .select('*, clientes(nombre_completo, telefono), sedes(nombre), motosan_grupo_motos(monto_moto, cuota_semanal, productos(nombre))')
    .eq('grupo_id', grupoId).order('created_at');

  const participantesConDatos = [];
  for(const p of (participantes||[])){
    const cuota = Number(p.motosan_grupo_motos?.cuota_semanal || 0);
    const { data: pagos } = await sb.from('motosan_pagos').select('*').eq('participante_id', p.id);
    const totalPagado = (pagos||[]).reduce((s,pg)=>s+Number(pg.monto),0);
    const semanasTranscurridas = Math.max(1, Math.floor((Date.now() - new Date(p.created_at).getTime()) / (7*24*60*60*1000)) + 1);
    const semanasEsperadas = Math.min(semanasTranscurridas, grupo.semanas_totales);
    const cuotasEsperadas = semanasEsperadas * cuota;
    const alDia = totalPagado >= cuotasEsperadas - cuota;
    participantesConDatos.push({ ...p, cuota, totalPagado, alDia, numPagos: (pagos||[]).length });
  }

  detalle.innerHTML = `
    <div class="card">
      <h3>${grupo.nombre} — ${grupo.semanas_totales} semanas totales</h3>

function autocompletarMontoMotoGrupo(semanas){
  const sel = document.getElementById('mgm-producto');
  const precio = sel.options[sel.selectedIndex]?.dataset.precio || 0;
  document.getElementById('mgm-monto').value = precio;
  recalcularCuotaMotoGrupo(semanas);
}
function recalcularCuotaMotoGrupo(semanas){
  const monto = parseFloat(document.getElementById('mgm-monto').value) || 0;
  document.getElementById('mgm-cuota').value = semanas > 0 ? (monto / semanas).toFixed(2) : '';
}

async function registrarPagoMotosan(participanteId, cuota){
  const msg = document.getElementById('motosan-pago-msg');
  const { data: participante } = await sb.from('motosan_participantes').select('*').eq('id', participanteId).single();

  if(!participante?.sede_id){
    msg.innerHTML = `<div class="msg err">Este participante no tiene sede asignada, así que el pago no se puede acreditar a ninguna caja. Corrige su sede antes de registrar el pago.</div>`;
    return;
  }

  const { data: caja } = await sb.from('cajas').select('*').eq('sede_id', participante.sede_id).single();
  if(!caja){
    msg.innerHTML = `<div class="msg err">No se encontró una caja para la sede de este participante. El pago no fue registrado.</div>`;
    return;
  }

  const pago = datosMonedaCaja('msp', cuota);
  if(pago.error){ msg.innerHTML = `<div class="msg err">${pago.error}</div>`; return; }

  const { error } = await sb.from('motosan_pagos').insert({ participante_id: participanteId, monto: cuota, created_by: ESTADO.perfil.id });
  if(error){ msg.innerHTML = `<div class="msg err">Error al registrar el pago: ${error.message}</div>`; return; }

  await sb.from('movimientos_caja').insert({
    caja_id: caja.id, sede_id: participante.sede_id, tipo: 'ingreso_abono', monto: cuota,
    moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
    descripcion: 'Pago semanal Motosán', referencia_id: participanteId, created_by: ESTADO.perfil.id
  });
  await sb.from('cajas').update({ saldo_actual: Number(caja.saldo_actual) + cuota }).eq('id', caja.id);

  cerrarModal();
  abrirGrupoMotosan(MOTOSAN_GRUPO_ACTIVO);
}

async function hacerSorteoMotosan(grupoId){
  const { data: grupo } = await sb.from('motosan_grupos').select('*').eq('id', grupoId).single();
  const { data: participantes } = await sb.from('motosan_participantes')
    .select('*, motosan_grupo_motos(monto_moto, cuota_semanal, producto_id, productos(nombre))')
    .eq('grupo_id', grupoId).eq('activo', true).eq('gano', false);

  const elegibles = [];
  for(const p of (participantes||[])){
    const cuota = Number(p.motosan_grupo_motos?.cuota_semanal || 0);
    const { data: pagos } = await sb.from('motosan_pagos').select('*').eq('participante_id', p.id);
    const totalPagado = (pagos||[]).reduce((s,pg)=>s+Number(pg.monto),0);
    const semanasTranscurridas = Math.max(1, Math.floor((Date.now() - new Date(p.created_at).getTime()) / (7*24*60*60*1000)) + 1);
    const semanasEsperadas = Math.min(semanasTranscurridas, grupo.semanas_totales);
    const cuotasEsperadas = semanasEsperadas * cuota;
    if(totalPagado >= cuotasEsperadas - cuota){ elegibles.push({ participante: p, totalPagado }); }
  }

  if(!elegibles.length){ alert('No hay participantes al día con sus pagos para entrar al sorteo este mes.'); return; }

  const ganador = elegibles[Math.floor(Math.random() * elegibles.length)];
  const { data: cliente } = await sb.from('clientes').select('*').eq('id', ganador.participante.cliente_id).single();
  const nombreMoto = ganador.participante.motosan_grupo_motos?.productos?.nombre || 'su moto';
  const productoId = ganador.participante.motosan_grupo_motos?.producto_id;
  const montoMoto = Number(ganador.participante.motosan_grupo_motos?.monto_moto || 0);

  if(!confirm(`🎉 El sorteo eligió a: ${cliente.nombre_completo} (moto: ${nombreMoto})\n\n¿Confirmar como ganador? Esto le entrega la moto de inventario y crea su cuenta por cobrar por el saldo restante.`)) return;

  await sb.from('motosan_participantes').update({ gano: true, fecha_gano: new Date().toISOString() }).eq('id', ganador.participante.id);

  const sedeGanador = ganador.participante.sede_id;

  const { data: invRow } = await sb.from('inventario').select('*').eq('sede_id', sedeGanador).eq('producto_id', productoId).maybeSingle();
  if(invRow){
    await sb.from('inventario').update({ cantidad: Math.max(0, Number(invRow.cantidad) - 1), updated_at: new Date().toISOString() }).eq('id', invRow.id);
  }
  await sb.from('movimientos_inventario').insert({
    sede_id: sedeGanador, producto_id: productoId, tipo: 'salida_venta',
    cantidad: 1, nota: `Motosán - entrega a ganador del sorteo (${cliente.nombre_completo})`, created_by: ESTADO.perfil.id
  });

  const saldoRestante = Math.max(0, montoMoto - ganador.totalPagado);
  if(saldoRestante > 0){
    await sb.from('cuentas_por_cobrar').insert({
      sede_id: sedeGanador, cliente_id: cliente.id,
      descripcion: `Motosán "${grupo.nombre}" — ${nombreMoto} entregada, saldo restante a pagar`,
      monto_total: montoMoto, saldo_pendiente: saldoRestante, estado: 'pagada_parcial'
    });
  }

  alert(`¡${cliente.nombre_completo} ganó el sorteo! La moto fue descontada del inventario de ${sedeNombre(sedeGanador)}${saldoRestante > 0 ? ' y se creó su cuenta por cobrar por el saldo restante (visible en Cuentas por Cobrar).' : ', y no queda saldo pendiente.'}`);
  abrirGrupoMotosan(grupoId);
}

async function confirmarPagoAhorro(planId, saldoActual){
  const msg = document.getElementById('pa-pago-msg');
  const moneda = document.getElementById('pa-pago-moneda').value;
  const metodo = document.getElementById('pa-pago-metodo').value;
  const montoOriginal = parseFloat(document.getElementById('pa-pago-monto').value);

  if(!montoOriginal || montoOriginal <= 0){ msg.innerHTML = `<div class="msg err">Ingresa un monto válido.</div>`; return; }

  let tasa = null;
  if(moneda !== 'USD'){

    if(!tasa || tasa <= 0){ msg.innerHTML = `<div class="msg err">Ingresa la tasa de cambio.</div>`; return; }
    montoUsd = montoOriginal / tasa;
  }

  await sb.from('planes_ahorro_pagos').insert({
    plan_id: planId, monto_usd: montoUsd, moneda, metodo,
    monto_original: montoOriginal, tasa_cambio: tasa, created_by: ESTADO.perfil.id
  });

  const nuevoSaldo = Math.max(0, saldoActual - montoUsd);
  const nuevoEstado = nuevoSaldo <= 0 ? 'pagada_completa' : 'pagada_parcial';
  const { data: plan } = await sb.from('planes_ahorro').update({ saldo_pendiente: nuevoSaldo, estado: nuevoEstado }).eq('id', planId).select().single();

  // Caja
  const { data: caja } = await sb.from('cajas').select('*').eq('sede_id', ESTADO.sedeSeleccionada).single();
  if(caja){
    await sb.from('movimientos_caja').insert({
      caja_id: caja.id, sede_id: ESTADO.sedeSeleccionada, tipo: 'ingreso_abono', monto: montoUsd,
      moneda, metodo_pago: metodo, monto_original: montoOriginal, tasa_cambio: tasa,
      descripcion: `Plan Ahorro — pago en ${moneda} por ${metodo}${tasa ? ` (tasa ${tasa})` : ''}`,
      referencia_id: planId, created_by: ESTADO.perfil.id
    });
    await sb.from('cajas').update({ saldo_actual: Number(caja.saldo_actual) + montoUsd }).eq('id', caja.id);
  }

  // Si se completó el plan: entregar la moto (descontar inventario)
  if(nuevoEstado === 'pagada_completa' && plan){
    const { data: invRow } = await sb.from('inventario').select('*').eq('sede_id', ESTADO.sedeSeleccionada).eq('producto_id', plan.producto_id).maybeSingle();
    if(invRow){
      await sb.from('inventario').update({ cantidad: Math.max(0, Number(invRow.cantidad) - 1), updated_at: new Date().toISOString() }).eq('id', invRow.id);
    }
    await sb.from('movimientos_inventario').insert({
      sede_id: ESTADO.sedeSeleccionada, producto_id: plan.producto_id, tipo: 'salida_venta',
      cantidad: 1, nota: 'Plan Ahorro completado — moto entregada', created_by: ESTADO.perfil.id
    });
  }

  cerrarModal();
  renderPlanAhorro();
}

function onRetencionChange(){
  const activo = document.getElementById('compra-aplica-retencion').checked;
  document.getElementById('compra-retencion-wrap').style.display = activo ? 'block' : 'none';
  calcularRetencion();
}

function calcularRetencion(){
  const iva = parseFloat(document.getElementById('compra-iva').value) || 0;
  const pct = parseFloat(document.getElementById('compra-retencion-pct').value) || 0;
  const retenido = iva * (pct/100);
  document.getElementById('compra-retencion-resumen').textContent =
    `Se retiene ${money(retenido)} de IVA (queda pendiente de enterar al SENIAT). Ese monto se descuenta de lo que le pagas al proveedor.`;
}

function abrirModalEnterarRetencion(compraId){
  document.getElementById('modal-contenido').innerHTML = `
    <h3>Marcar retención como enterada</h3>
    <div id="enterar-msg"></div>
    <div class="form-row"><label>Número de comprobante / planilla (opcional)</label><input type="text" id="enterar-comprobante" placeholder="Opcional"></div>
    <div class="acciones">
      <button class="btn secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" onclick="confirmarEnterarRetencion('${compraId}')">Confirmar</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('activo');
}

async function confirmarEnterarRetencion(compraId){
  const numero = document.getElementById('enterar-comprobante').value.trim() || null;
  await sb.from('compras').update({
    retencion_enterada: true, retencion_fecha_entero: new Date().toISOString(), retencion_numero_comprobante: numero
  }).eq('id', compraId);

function cargarFotoFactura(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const resultado = e.target.result; // data:image/xxx;base64,....
    FACTURA_IMG_MEDIA = file.type || 'image/jpeg';
    FACTURA_IMG_BASE64 = resultado.split(',')[1];
    document.getElementById('factura-preview').innerHTML = `<img src="${resultado}" style="max-width:100%; border-radius:8px; margin-top:8px; border:1px solid var(--borde);">`;
    document.getElementById('btn-leer-factura').style.display = 'inline-block';
  };
  reader.readAsDataURL(file);
}

async function leerFacturaConIA(){
  const btn = document.getElementById('btn-leer-factura');
  const msg = document.getElementById('compra-msg');
  msg.innerHTML = '';
  if(!FACTURA_IMG_BASE64){ msg.innerHTML = `<div class="msg err">Sube primero una foto de la factura.</div>`; return; }

  btn.disabled = true; btn.textContent = 'Leyendo factura...';

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: FACTURA_IMG_MEDIA, data: FACTURA_IMG_BASE64 } },
            { type: "text", text: "Esta imagen es una factura de compra de mercancía (motos, repuestos, cascos, accesorios, aceite). Responde ÚNICAMENTE con un objeto JSON, sin markdown ni texto adicional, con este formato exacto: {\"numero_factura\": \"string o null si no aparece\", \"proveedor\": \"string o null si no aparece\", \"iva\": number o null si no aparece un monto de IVA en la factura, \"items\": [{\"nombre\": \"string\", \"codigo\": \"string o null si no aparece\", \"cantidad\": number, \"precio_unitario\": number}]}. \"numero_factura\" es el número o código de control impreso en la factura (usualmente arriba). \"proveedor\" es el nombre de la empresa que emite la factura (el vendedor, no el comprador). \"iva\" es el monto total de IVA de la factura si aparece desglosado. El campo \"codigo\" de cada item es el código/SKU/referencia del proveedor si aparece impreso junto al producto. No incluyas en \"items\" líneas de impuestos, envío, descuentos o totales. Si no puedes leer el precio unitario de una línea, usa 0." }
          ]
        }]
      })
    });
    const data = await response.json();
    const textoRespuesta = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('');
    const limpio = textoRespuesta.replace(/```json|```/g, '').trim();
    const resultado = JSON.parse(limpio);
    const items = resultado.items || [];

    FACTURA_ITEMS = items.map(it => {
      const match = mejorMatchProducto(it.nombre, it.codigo);
      return {
        nombre_factura: it.nombre,
        codigo_factura: it.codigo || null,
        cantidad: Number(it.cantidad) || 1,
        precio_unitario: Number(it.precio_unitario) || 0,
        producto_id: match ? match.producto.id : null,
        producto_nombre: match ? match.producto.nombre : null,
        score: match ? match.score : 0,
        porCodigo: match ? match.porCodigo : false,
        crear_nuevo: !match
      };
    });

    // Autocompletar número de factura y proveedor leídos de la imagen
    if(resultado.numero_factura){
      document.getElementById('compra-numero-factura').value = resultado.numero_factura;
    }
    if(resultado.proveedor && !document.getElementById('compra-proveedor').value.trim()){
      document.getElementById('compra-proveedor').value = resultado.proveedor;
    }
    if(resultado.iva){
      const checkboxRetencion = document.getElementById('compra-aplica-retencion');
      if(checkboxRetencion.checked){
        document.getElementById('compra-iva').value = resultado.iva;
        calcularRetencion();
      }
    }

    renderItemsFactura();
    const extras = [];
    if(resultado.numero_factura) extras.push(`factura N° ${resultado.numero_factura}`);
    if(resultado.proveedor) extras.push(`proveedor "${resultado.proveedor}"`);
    msg.innerHTML = `<div class="msg ok">Factura leída: ${FACTURA_ITEMS.length} línea(s) encontradas${extras.length ? ' — ' + extras.join(', ') : ''}. Revisa los emparejamientos abajo.</div>`;
  } catch(err){
    msg.innerHTML = `<div class="msg err">No se pudo leer la factura automáticamente. Intenta con una foto más clara, o agrega los productos manualmente abajo.</div>`;
    FACTURA_ITEMS = [];
    renderItemsFactura();
  }

  btn.disabled = false; btn.textContent = '📷 Leer factura con IA';
}

function renderItemsFactura(){
  const wrap = document.getElementById('factura-items-wrap');
  if(!FACTURA_ITEMS.length){
    wrap.innerHTML = `
      <div class="empty">No hay líneas cargadas.</div>
      <button class="btn secundario chico" onclick="agregarLineaFacturaManual()">+ Agregar línea manual</button>
    `;
    actualizarTotalCompra();
    return;
  }

  wrap.innerHTML = FACTURA_ITEMS.map((it, i) => `
    <div class="card" style="background:var(--negro3); padding:14px; margin-bottom:10px;">
      <div style="font-size:13px; color:var(--carbon); margin-bottom:6px;">Texto de la factura: "${it.nombre_factura}"${it.codigo_factura ? ` — código: ${it.codigo_factura}` : ''}</div>
      <div class="inline-2">
        <div class="form-row" style="margin-bottom:8px;">
          <label>Producto en catálogo</label>
          ${it.crear_nuevo ? `
            <input type="text" value="${it.producto_nombre || it.nombre_factura}" onchange="editarNombreNuevoProducto(${i}, this.value)">
            <div class="stock" style="color:var(--rojo);">Sin coincidencia — se creará como producto nuevo${it.codigo_factura ? ` (con código ${it.codigo_factura})` : ''}</div>
          ` : `
            <input type="text" value="${it.producto_nombre}" readonly>
            <div class="stock">${it.porCodigo ? '✅ Coincidencia exacta por código' : `Coincidencia ${Math.round(it.score*100)}% por nombre`} — <span style="cursor:pointer; text-decoration:underline;" onclick="quitarMatchLinea(${i})">quitar coincidencia</span></div>
          `}
        </div>
        <div class="form-row" style="margin-bottom:8px;">
          <label>Cantidad</label>
          <input type="number" min="0.01" step="0.01" value="${it.cantidad}" onchange="editarCantidadLinea(${i}, this.value)">
        </div>
      </div>
      <div class="form-row" style="margin-bottom:0;">
        <label>Costo unitario</label>
        <input type="number" min="0" step="0.01" value="${it.precio_unitario}" onchange="editarPrecioLinea(${i}, this.value)">
      </div>
      <div style="text-align:right; margin-top:8px;">
        <span class="quitar" onclick="quitarLineaFactura(${i})">Quitar línea ✕</span>
      </div>
    </div>
  `).join('') + `<button class="btn secundario chico" onclick="agregarLineaFacturaManual()">+ Agregar línea manual</button>`;

  actualizarTotalCompra();
}

function editarNombreNuevoProducto(i, val){ FACTURA_ITEMS[i].producto_nombre = val; }
function editarCantidadLinea(i, val){ FACTURA_ITEMS[i].cantidad = parseFloat(val)||0; actualizarTotalCompra(); }
function editarPrecioLinea(i, val){ FACTURA_ITEMS[i].precio_unitario = parseFloat(val)||0; actualizarTotalCompra(); }
function quitarLineaFactura(i){ FACTURA_ITEMS.splice(i,1); renderItemsFactura(); }
function quitarMatchLinea(i){
  FACTURA_ITEMS[i].crear_nuevo = true;
  FACTURA_ITEMS[i].producto_id = null;
  FACTURA_ITEMS[i].producto_nombre = FACTURA_ITEMS[i].nombre_factura;
  renderItemsFactura();
}
function agregarLineaFacturaManual(){
  FACTURA_ITEMS.push({ nombre_factura: '(manual)', cantidad: 1, precio_unitario: 0, producto_id: null, producto_nombre: '', score: 0, crear_nuevo: true });
  renderItemsFactura();
}
function actualizarTotalCompra(){
  const total = FACTURA_ITEMS.reduce((s,it)=>s + it.cantidad*it.precio_unitario, 0);
  const el = document.getElementById('total-compra');
  if(el) el.textContent = money(total);
}

async function registrarCompra(){
  const msg = document.getElementById('compra-msg');
  msg.innerHTML = '';

  if(!FACTURA_ITEMS.length){ msg.innerHTML = `<div class="msg err">Agrega al menos un producto a la compra.</div>`; return; }
  const nombreProveedor = document.getElementById('compra-proveedor').value.trim();
  const numeroFactura = document.getElementById('compra-numero-factura').value.trim() || null;
  const modalidad = document.getElementById('compra-modalidad').value;
  const total = FACTURA_ITEMS.reduce((s,it)=>s + it.cantidad*it.precio_unitario, 0);

  const aplicaRetencion = document.getElementById('compra-aplica-retencion').checked;
  const montoIva = aplicaRetencion ? (parseFloat(document.getElementById('compra-iva').value) || 0) : 0;
  const retencionPct = aplicaRetencion ? (parseFloat(document.getElementById('compra-retencion-pct').value) || 0) : 0;
  const retencionFechaLimite = aplicaRetencion ? (document.getElementById('compra-retencion-fecha-limite').value || null) : null;
  const montoRetenido = aplicaRetencion ? montoIva * (retencionPct/100) : 0;
  const montoAPagarProveedor = Math.max(0, total - montoRetenido);

  let montoPagado = montoAPagarProveedor;
  if(modalidad === 'credito_directo'){
    montoPagado = parseFloat(document.getElementById('compra-abono').value) || 0;
    if(montoPagado > montoAPagarProveedor){ msg.innerHTML = `<div class="msg err">El abono no puede ser mayor a lo que se le debe al proveedor (${money(montoAPagarProveedor)}).</div>`; return; }
  }

  let pagoCompra = null;
  if(montoPagado > 0){
    pagoCompra = datosMonedaCaja('cp', montoPagado);
    if(pagoCompra.error){ msg.innerHTML = `<div class="msg err">${pagoCompra.error}</div>`; return; }
  }

  // Proveedor: buscar o crear
  let proveedorId = null;
  if(nombreProveedor){
    const existente = ESTADO.proveedores.find(p => p.nombre.toLowerCase() === nombreProveedor.toLowerCase());
    if(existente){ proveedorId = existente.id; }
    else {
      const { data: nuevoProv } = await sb.from('proveedores').insert({ nombre: nombreProveedor }).select().single();
      proveedorId = nuevoProv?.id || null;
    }
  }

  // Crear productos nuevos donde haga falta
  for(const it of FACTURA_ITEMS){
    if(it.crear_nuevo){
      const { data: nuevoProd, error } = await sb.from('productos').insert({
        nombre: it.producto_nombre || it.nombre_factura, precio: it.precio_unitario, sku: it.codigo_factura || null
      }).select().single();
      if(error){ msg.innerHTML = `<div class="msg err">Error creando producto "${it.nombre_factura}": ${error.message}</div>`; return; }
      it.producto_id = nuevoProd.id;
      ESTADO.productos.push(nuevoProd);
    }
  }

  const estadoCompra = modalidad === 'contado' ? 'pagada_completa' : (montoPagado >= montoAPagarProveedor ? 'pagada_completa' : (montoPagado > 0 ? 'pagada_parcial' : 'pendiente'));

  const { data: compra, error: errCompra } = await sb.from('compras').insert({
    sede_id: ESTADO.sedeSeleccionada, proveedor_id: proveedorId, modalidad, numero_factura: numeroFactura,
    estado: estadoCompra, total, monto_pagado: montoPagado, created_by: ESTADO.perfil.id,
    aplica_retencion: aplicaRetencion, monto_iva: montoIva, retencion_pct: retencionPct, monto_retenido: montoRetenido,
    retencion_fecha_limite: retencionFechaLimite
  }).select().single();
  if(errCompra){ msg.innerHTML = `<div class="msg err">Error: ${errCompra.message}</div>`; return; }

  // Items de compra
  const itemsInsert = FACTURA_ITEMS.map(it => ({
    compra_id: compra.id, producto_id: it.producto_id, cantidad: it.cantidad,
    costo_unitario: it.precio_unitario, subtotal: it.cantidad * it.precio_unitario
  }));
  await sb.from('compra_items').insert(itemsInsert);

  // Sumar inventario + movimientos
  for(const it of FACTURA_ITEMS){
    const { data: existenteInv } = await sb.from('inventario').select('*')
      .eq('sede_id', ESTADO.sedeSeleccionada).eq('producto_id', it.producto_id).maybeSingle();
    if(existenteInv){
      await sb.from('inventario').update({ cantidad: Number(existenteInv.cantidad) + it.cantidad, updated_at: new Date().toISOString() }).eq('id', existenteInv.id);
    } else {
      await sb.from('inventario').insert({ sede_id: ESTADO.sedeSeleccionada, producto_id: it.producto_id, cantidad: it.cantidad });
    }
    await sb.from('movimientos_inventario').insert({
      sede_id: ESTADO.sedeSeleccionada, producto_id: it.producto_id, tipo: 'entrada_compra',
      cantidad: it.cantidad, referencia_id: compra.id, created_by: ESTADO.perfil.id
    });
  }

  // Caja (si se pagó algo ahora)
  if(montoPagado > 0){
    const { caja, sede_id: sedeCajaId } = await obtenerCajaOrigen('cp');
    if(caja){
      await sb.from('movimientos_caja').insert({
        caja_id: caja.id, sede_id: sedeCajaId, tipo: 'egreso_compra', monto: montoPagado,
        moneda: pagoCompra.moneda, metodo_pago: pagoCompra.metodo, monto_original: pagoCompra.montoOriginal, tasa_cambio: pagoCompra.tasa,
        descripcion: `Compra${nombreProveedor ? ' a ' + nombreProveedor : ''}`, referencia_id: compra.id, created_by: ESTADO.perfil.id
      });
      await sb.from('cajas').update({ saldo_actual: Number(caja.saldo_actual) - montoPagado }).eq('id', caja.id);
    }
  }

  // Cuenta por pagar si quedó saldo (sobre lo que se le debe al proveedor, no sobre el total con IVA retenido)
  if(modalidad === 'credito_directo' && estadoCompra !== 'pagada_completa' && proveedorId){
    await sb.from('cuentas_por_pagar').insert({
      compra_id: compra.id, sede_id: ESTADO.sedeSeleccionada, proveedor_id: proveedorId,
      monto_total: montoAPagarProveedor, saldo_pendiente: montoAPagarProveedor - montoPagado, estado: estadoCompra
    });
  }

  msg.innerHTML = `<div class="msg ok">Compra registrada. Inventario actualizado.${montoRetenido > 0 ? ` Se retuvo ${money(montoRetenido)} de IVA — queda pendiente en la sección de retenciones de abajo.` : ''}</div>`;
  renderCompras();
}

const NOMBRES_METODO_ICONO = {
  'Efectivo': '💵', 'Zelle': '📲', 'Bancolombia': '🏦', 'Pago móvil / Transferencia': '🏦'
};
const SIMBOLO_MONEDA = { USD: '$', COP: 'COP ', VES: 'Bs. ' };
const ORDEN_MONEDA = { USD: 0, COP: 1, VES: 2 };

function fmtMoneda(moneda, n){
  return `${SIMBOLO_MONEDA[moneda]||''}${Number(n).toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
}

// Agrupa una lista de movimientos_caja por moneda + método de pago, sumando en la moneda original (sin convertir)
function agruparPorMonedaMetodo(movimientos){
  const grupos = {};
  for(const m of (movimientos||[])){
    const moneda = m.moneda || 'USD';
    const metodo = m.metodo_pago || 'Efectivo';
    const clave = moneda + '|' + metodo;
    if(!grupos[clave]) grupos[clave] = { moneda, metodo, ingresos: 0, egresos: 0 };
    const montoOriginal = Number(m.monto_original ?? m.monto);
    if(m.tipo.startsWith('ingreso')) grupos[clave].ingresos += montoOriginal;
    else grupos[clave].egresos += montoOriginal;
  }
  return Object.values(grupos).sort((a,b)=>
    (ORDEN_MONEDA[a.moneda]-ORDEN_MONEDA[b.moneda]) || a.metodo.localeCompare(b.metodo));
}

function tablaMultimoneda(movimientos, notaExtra){
  const gruposOrdenados = agruparPorMonedaMetodo(movimientos);
  return `
    <div class="card">
      <h3>💱 Panel multimoneda — cuánto hay de cada tipo</h3>
      <div class="stock" style="margin-bottom:10px;">Desglose por moneda y forma de pago, en la moneda en que realmente se recibió/pagó (sin convertir).${notaExtra ? ' ' + notaExtra : ''}</div>
      <table>
        <thead><tr><th>Moneda</th><th>Forma de pago</th><th>Ingresos</th><th>Egresos</th><th>Neto</th></tr></thead>
        <tbody>
          ${gruposOrdenados.map(g=>{
            const neto = g.ingresos - g.egresos;
            return `<tr>
              <td>${g.moneda}</td>
              <td>${NOMBRES_METODO_ICONO[g.metodo]||''} ${g.metodo}</td>
              <td style="color:var(--verde)">${fmtMoneda(g.moneda, g.ingresos)}</td>
              <td style="color:var(--rojo)">${fmtMoneda(g.moneda, g.egresos)}</td>
              <td style="font-weight:600;">${fmtMoneda(g.moneda, neto)}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="5" class="empty">Sin movimientos todavía</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

async function registrarGasto(){
  const msg = document.getElementById('gasto-msg');
  const tipo = document.getElementById('tipo-gasto').value;
  const monto = parseFloat(document.getElementById('monto-gasto').value);
  const desc = document.getElementById('desc-gasto').value.trim();

  if(!monto || monto <= 0){ msg.innerHTML = `<div class="msg err">Ingresa un monto válido.</div>`; return; }

  const pago = datosMonedaCaja('gto', monto);
  if(pago.error){ msg.innerHTML = `<div class="msg err">${pago.error}</div>`; return; }

  const { data: gasto, error } = await sb.from('gastos').insert({
    sede_id: ESTADO.sedeSeleccionada, tipo, monto, descripcion: desc, created_by: ESTADO.perfil.id
  }).select().single();
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }

  if(caja){
    const tipoMovimiento = 'egreso_' + (tipo === 'pago_empleado' ? 'pago_empleado' : tipo);
    await sb.from('movimientos_caja').insert({
      caja_id: caja.id, sede_id: ESTADO.sedeSeleccionada, tipo: tipoMovimiento, monto,
      moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
      descripcion: desc || TIPOS_GASTO[tipo], referencia_id: gasto.id, created_by: ESTADO.perfil.id
    });

}

    moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,

    msg.innerHTML = `<div class="msg err">No puedes entregar más de lo que hay en la Caja Matriz (${money(cajaMatriz.saldo_actual)}).</div>`; return;
  }

  let fotoUrl = null;
  if(archivoFoto){
    msg.innerHTML = `<div class="msg ok">Subiendo comprobante...</div>`;
    try{ fotoUrl = await subirFoto(archivoFoto, 'comprobantes-terceros'); }
    catch(err){ msg.innerHTML = `<div class="msg err">Error subiendo la foto: ${err.message}</div>`; return; }
  }

  const { error } = await sb.from('movimientos_tercero').insert({
    tercero_id: terceroId, sede_id: null, tipo, fecha, monto,
    moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
    motivo: motivo || null, foto_url: fotoUrl, afecta_caja: true, created_by: ESTADO.perfil.id
  });
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }

  const nombreTercero = ESTADO.terceros.find(t=>t.id===terceroId)?.nombre || 'tercero';
  const tipoMovCaja = tipo === 'entrega' ? 'egreso_entrega_tercero' : 'ingreso_recibo_tercero';
  await sb.from('movimientos_caja').insert({
    caja_id: cajaMatriz.id, sede_id: null, tipo: tipoMovCaja, monto,
    moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
    descripcion: tipo === 'entrega' ? `Entrega a ${nombreTercero}${motivo ? ' — ' + motivo : ''}` : `Recibido de ${nombreTercero}${motivo ? ' — ' + motivo : ''}`,
    created_by: ESTADO.perfil.id
  });
  const nuevoSaldo = tipo === 'entrega' ? Number(cajaMatriz.saldo_actual) - monto : Number(cajaMatriz.saldo_actual) + monto;
  await sb.from('cajas').update({ saldo_actual: nuevoSaldo }).eq('id', cajaMatriz.id);

  renderCajaMatriz();
}

  const { data: gasto, error } = await sb.from('gastos').insert({

  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }

let FINANZAS_RANGO = 'mes';

async function renderFinanzas(){
  const cont = document.getElementById('contenido-tab');

  cont.innerHTML = `
    <div class="tabs-sub" id="finanzas-rango-tabs">

      <button onclick="cambiarRangoFinanzas('semana', this)">Esta semana</button>
      <button onclick="cambiarRangoFinanzas('mes', this)">Este mes</button>
      <button onclick="cambiarRangoFinanzas('personalizado', this)">Personalizado</button>
    </div>
    <div id="finanzas-rango-personalizado" style="display:none; margin-bottom:16px;">
      <div class="inline-2" style="max-width:420px;">
        <div class="form-row" style="margin-bottom:0;"><label>Desde</label><input type="date" id="finanzas-desde"></div>
        <div class="form-row" style="margin-bottom:0;"><label>Hasta</label><input type="date" id="finanzas-hasta"></div>
      </div>
      <button class="btn chico secundario" style="margin-top:10px;" onclick="calcularFinanzas()">Aplicar</button>
    </div>
    <div id="finanzas-contenido"><div class="empty">Cargando...</div></div>
  `;

  FINANZAS_RANGO = 'hoy';
  calcularFinanzas();
}

function cambiarRangoFinanzas(rango, btn){
  FINANZAS_RANGO = rango;
  document.querySelectorAll('#finanzas-rango-tabs button').forEach(b=>b.classList.remove('activo'));
  btn.classList.add('activo');
  document.getElementById('finanzas-rango-personalizado').style.display = rango === 'personalizado' ? 'block' : 'none';
  if(rango !== 'personalizado') calcularFinanzas();
}

function calcularRangoFechas(){
  const ahora = new Date();
  let desde, hasta;
  if(FINANZAS_RANGO === 'hoy'){
    desde = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
    hasta = new Date(desde.getTime() + 24*60*60*1000);
  } else if(FINANZAS_RANGO === 'semana'){
    const diaSemana = ahora.getDay();
    desde = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() - diaSemana);
    hasta = new Date(desde.getTime() + 7*24*60*60*1000);
  } else if(FINANZAS_RANGO === 'mes'){
    desde = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
    hasta = new Date(ahora.getFullYear(), ahora.getMonth()+1, 1);
  } else {
    const desdeVal = document.getElementById('finanzas-desde').value;
    const hastaVal = document.getElementById('finanzas-hasta').value;
    if(!desdeVal || !hastaVal){ return null; }
    desde = new Date(desdeVal + 'T00:00:00');
    hasta = new Date(hastaVal + 'T23:59:59');
  }
  return { desde, hasta };
}

async function calcularFinanzas(){
  const cont = document.getElementById('finanzas-contenido');
  cont.innerHTML = `<div class="empty">Calculando...</div>`;

  const rango = calcularRangoFechas();
  if(!rango){ cont.innerHTML = `<div class="empty">Selecciona las fechas y presiona Aplicar.</div>`; return; }
  const { desde, hasta } = rango;

  // Ventas del rango en esta sede
  const { data: ventas } = await sb.from('ventas')
    .select('*, venta_items(cantidad, precio_unitario, subtotal, producto_id)')
    .eq('sede_id', ESTADO.sedeSeleccionada)
    .gte('created_at', desde.toISOString()).lt('created_at', hasta.toISOString());

  // Costos de producto para calcular costo de mercancía vendida
  const { data: productos } = await sb.from('productos').select('id, costo');
  const costoPorProducto = {};
  (productos||[]).forEach(p => costoPorProducto[p.id] = Number(p.costo||0));

  let ingresosPorVentas = 0;
  let costoMercancia = 0;
  (ventas||[]).forEach(v => {
    ingresosPorVentas += Number(v.total);
    (v.venta_items||[]).forEach(item => {
      costoMercancia += Number(item.cantidad) * (costoPorProducto[item.producto_id] || 0);
    });
  });

  // Abonos recibidos en el rango (cuentas por cobrar) — dinero que entró aunque la venta fuera de antes
  const { data: movCajaIngresos } = await sb.from('movimientos_caja')
    .select('*')
    .eq('sede_id', ESTADO.sedeSeleccionada)
    .in('tipo', ['ingreso_venta','ingreso_abono'])
    .gte('created_at', desde.toISOString()).lt('created_at', hasta.toISOString());
  const ingresosCaja = (movCajaIngresos||[]).reduce((s,m)=>s+Number(m.monto),0);

  // Gastos del rango, desglosados por tipo
  const { data: gastos } = await sb.from('gastos')
    .select('*')
    .eq('sede_id', ESTADO.sedeSeleccionada)
    .gte('created_at', desde.toISOString()).lt('created_at', hasta.toISOString());
  const totalGastos = (gastos||[]).reduce((s,g)=>s+Number(g.monto),0);
  const gastosPorTipo = {};
  (gastos||[]).forEach(g => { gastosPorTipo[g.tipo] = (gastosPorTipo[g.tipo]||0) + Number(g.monto); });

  const utilidad = ingresosPorVentas - costoMercancia - totalGastos;

  // Traslados del período — solo informativo, no afecta caja ni utilidad (el costo ya se descuenta al vender, sin importar el origen)
  const { data: trasladosRecibidos } = await sb.from('traslados_inventario')
    .select('*, productos(nombre)')
    .eq('sede_destino_id', ESTADO.sedeSeleccionada).eq('estado', 'aceptado')
    .gte('resuelto_at', desde.toISOString()).lt('resuelto_at', hasta.toISOString());
  const { data: trasladosEnviados } = await sb.from('traslados_inventario')
    .select('*, productos(nombre)')
    .eq('sede_origen_id', ESTADO.sedeSeleccionada).eq('estado', 'aceptado')
    .gte('resuelto_at', desde.toISOString()).lt('resuelto_at', hasta.toISOString());
  const valorTraslados = (lista) => (lista||[]).reduce((s,t)=>s + Number(t.cantidad) * (costoPorProducto[t.producto_id]||0), 0);

  cont.innerHTML = `
    <div class="kpis">
      <div class="kpi verde"><div class="label">Ingresos (ventas del período)</div><div class="valor">${money(ingresosPorVentas)}</div></div>
      <div class="kpi"><div class="label">Costo de mercancía vendida</div><div class="valor">${money(costoMercancia)}</div></div>
      <div class="kpi rojo"><div class="label">Gastos operativos</div><div class="valor">${money(totalGastos)}</div></div>
      <div class="kpi ${utilidad >= 0 ? 'verde' : 'rojo'}"><div class="label">Utilidad estimada</div><div class="valor">${money(utilidad)}</div></div>
    </div>

    <div class="card">
      <h3>🔄 Traslados con otras sedes en el período (solo informativo)</h3>
      <div class="stock" style="margin-bottom:10px;">Esto no afecta caja ni la utilidad de arriba — el costo de estas unidades ya se descuenta automáticamente en "Costo de mercancía vendida" el día que esta sede las venda. Es solo para que veas de dónde viene tu inventario.</div>
      <div class="inline-2">
        <div class="kpi"><div class="label">Unidades recibidas por traslado</div><div class="valor">${(trasladosRecibidos||[]).reduce((s,t)=>s+Number(t.cantidad),0)} <span style="font-size:13px; color:var(--carbon);">(${money(valorTraslados(trasladosRecibidos))} en costo)</span></div></div>
        <div class="kpi"><div class="label">Unidades enviadas por traslado</div><div class="valor">${(trasladosEnviados||[]).reduce((s,t)=>s+Number(t.cantidad),0)} <span style="font-size:13px; color:var(--carbon);">(${money(valorTraslados(trasladosEnviados))} en costo)</span></div></div>
      </div>
    </div>

    <div class="card">
      <h3>Dinero que entró a caja en el período (ventas + abonos)</h3>
      <div class="kpi verde" style="max-width:260px;"><div class="label">Total ingresado a caja</div><div class="valor">${money(ingresosCaja)}</div></div>
      <div class="stock" style="margin-top:8px;">Este número puede diferir de "Ingresos" de arriba porque incluye abonos de ventas a crédito hechas en otro período, y no incluye el saldo pendiente de ventas a crédito de este período.</div>
    </div>

    <div class="card">
      <h3>Desglose de gastos por tipo</h3>
      <table>
        <thead><tr><th>Tipo</th><th>Monto</th></tr></thead>
        <tbody>
          ${Object.keys(gastosPorTipo).length ? Object.entries(gastosPorTipo).map(([tipo, monto])=>`
            <tr><td>${TIPOS_GASTO[tipo] || tipo}</td><td>${money(monto)}</td></tr>
          `).join('') : `<tr><td colspan="2" class="empty">Sin gastos registrados en este período</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>Ventas del período (${(ventas||[]).length})</h3>
      <table>
        <thead><tr><th>Fecha</th><th>Modalidad</th><th>Total</th><th>Estado</th></tr></thead>
        <tbody>
          ${(ventas||[]).slice(0,30).map(v=>`
            <tr>
              <td>${fecha(v.created_at)}</td>
              <td><span class="badge ${v.modalidad}">${MODALIDADES[v.modalidad]||v.modalidad}</span></td>
              <td>${money(v.total)}</td>
              <td><span class="badge ${v.estado}">${v.estado.replace('_',' ')}</span></td>
            </tr>
          `).join('') || `<tr><td colspan="4" class="empty">Sin ventas en este período</td></tr>`}
        </tbody>
      </table>
      ${(ventas||[]).length > 30 ? `<div class="stock" style="margin-top:8px;">Mostrando las primeras 30 de ${ventas.length} ventas.</div>` : ''}
    </div>
  `;
}

function buscarClienteInputCxc(txt){
  document.getElementById('cxc-cliente-id-seleccionado').value = '';
  const lista = document.getElementById('cxc-lista-clientes');
  if(!txt.trim()){ lista.style.display='none'; return; }
  const t = txt.toLowerCase();
  const results = ESTADO.clientes.filter(c => c.nombre_completo.toLowerCase().includes(t)).slice(0,8);
  let html = results.map(c => `<div onclick="seleccionarClienteCxc('${c.id}','${c.nombre_completo.replace(/'/g,"\\'")}')">${c.nombre_completo}</div>`).join('');
  html += `<div style="color:var(--rojo);" onclick="crearClienteRapidoCxc('${txt.replace(/'/g,"\\'")}')">+ Crear cliente nuevo: "${txt}"</div>`;
  lista.innerHTML = html;
  lista.style.display = 'block';
}
function seleccionarClienteCxc(id, nombre){
  document.getElementById('cxc-cliente-id-seleccionado').value = id;
  document.getElementById('cxc-buscar-cliente').value = nombre;
  document.getElementById('cxc-lista-clientes').style.display = 'none';
}
async function crearClienteRapidoCxc(nombre){
  if(!nombre.trim()) return;
  const { data, error } = await sb.from('clientes').insert({ nombre_completo: nombre.trim() }).select().single();
  if(error){ alert('Error creando cliente: ' + error.message); return; }
  ESTADO.clientes.push(data);
  seleccionarClienteCxc(data.id, data.nombre_completo);
}

async function crearCuentaPorCobrarManual(){
  const msg = document.getElementById('cxc-manual-msg');
  const clienteId = document.getElementById('cxc-cliente-id-seleccionado').value;
  const descripcion = document.getElementById('cxc-descripcion').value.trim();
  const montoTotal = parseFloat(document.getElementById('cxc-monto-total').value);
  const saldoPendiente = parseFloat(document.getElementById('cxc-saldo-pendiente').value);

  if(!clienteId){ msg.innerHTML = `<div class="msg err">Selecciona o crea un cliente.</div>`; return; }
  if(!montoTotal || montoTotal <= 0){ msg.innerHTML = `<div class="msg err">Ingresa el monto total de la deuda.</div>`; return; }
  if(isNaN(saldoPendiente) || saldoPendiente < 0 || saldoPendiente > montoTotal){ msg.innerHTML = `<div class="msg err">El saldo pendiente debe ser mayor o igual a 0 y menor o igual al total.</div>`; return; }

  const estado = saldoPendiente <= 0 ? 'pagada_completa' : (saldoPendiente < montoTotal ? 'pagada_parcial' : 'pendiente');

  const { error } = await sb.from('cuentas_por_cobrar').insert({
    sede_id: ESTADO.sedeSeleccionada, cliente_id: clienteId, descripcion,
    monto_total: montoTotal, saldo_pendiente: saldoPendiente, estado
  });
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }

  msg.innerHTML = `<div class="msg ok">Cuenta por cobrar cargada correctamente.</div>`;
  renderCobrar();
}

function abrirModalAbono(cxcId, saldo){
  document.getElementById('modal-contenido').innerHTML = `
    <h3>Registrar abono</h3>
    <div id="abono-modal-msg"></div>
    <div class="form-row"><label>Saldo pendiente actual</label><input type="text" value="${money(saldo)}" disabled></div>
    <div class="form-row"><label>Monto del abono</label><input type="number" id="monto-abono" min="0.01" max="${saldo}" step="0.01"></div>
    <div class="form-row"><label>Nota (opcional)</label><input type="text" id="nota-abono"></div>
    ${bloqueMoneda('cxca')}
    <div class="acciones">
      <button class="btn secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" onclick="confirmarAbono('${cxcId}', ${saldo})">Registrar abono</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('activo');
  actualizarMetodosGenerico('cxca');
}

function cerrarModal(){ document.getElementById('modal-bg').classList.remove('activo'); }

async function confirmarAbono(cxcId, saldoActual){
  const msg = document.getElementById('abono-modal-msg');
  const monto = parseFloat(document.getElementById('monto-abono').value);
  const nota = document.getElementById('nota-abono').value.trim();
  if(!monto || monto <= 0 || monto > saldoActual){
    msg.innerHTML = `<div class="msg err">Monto inválido.</div>`; return;
  }
  const pago = datosMonedaCaja('cxca', monto);
  if(pago.error){ msg.innerHTML = `<div class="msg err">${pago.error}</div>`; return; }

  await sb.from('abonos').insert({ cuenta_por_cobrar_id: cxcId, monto, nota, created_by: ESTADO.perfil.id });

  const nuevoSaldo = saldoActual - monto;
  const nuevoEstado = nuevoSaldo <= 0 ? 'pagada_completa' : 'pagada_parcial';
  const { data: cxcActualizada } = await sb.from('cuentas_por_cobrar')
    .update({ saldo_pendiente: nuevoSaldo, estado: nuevoEstado }).eq('id', cxcId).select().single();

  if(cxcActualizada?.venta_id){
    const { data: venta } = await sb.from('ventas').select('*').eq('id', cxcActualizada.venta_id).single();
    if(venta){
      await sb.from('ventas').update({
        monto_pagado: Number(venta.monto_pagado) + monto, estado: nuevoEstado
      }).eq('id', venta.id);
    }
  }

  const { data: caja } = await sb.from('cajas').select('*').eq('sede_id', ESTADO.sedeSeleccionada).single();
  if(caja){
    await sb.from('movimientos_caja').insert({
      caja_id: caja.id, sede_id: ESTADO.sedeSeleccionada, tipo: 'ingreso_abono', monto,
      moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
      descripcion: nota || 'Abono a cuenta por cobrar', referencia_id: cxcId, created_by: ESTADO.perfil.id
    });
    await sb.from('cajas').update({ saldo_actual: Number(caja.saldo_actual) + monto }).eq('id', caja.id);
  }

  cerrarModal();
  renderCobrar();
}

function buscarProveedorInputCxp(txt){
  document.getElementById('cxp-proveedor-id-seleccionado').value = '';
  const lista = document.getElementById('cxp-lista-proveedores');
  if(!txt.trim()){ lista.style.display='none'; return; }
  const t = txt.toLowerCase();
  const results = (ESTADO.proveedores||[]).filter(p => p.nombre.toLowerCase().includes(t)).slice(0,8);
  let html = results.map(p => `<div onclick="seleccionarProveedorCxp('${p.id}','${p.nombre.replace(/'/g,"\\'")}')">${p.nombre}</div>`).join('');
  html += `<div style="color:var(--rojo);" onclick="crearProveedorRapidoCxp('${txt.replace(/'/g,"\\'")}')">+ Crear proveedor nuevo: "${txt}"</div>`;
  lista.innerHTML = html;
  lista.style.display = 'block';
}
function seleccionarProveedorCxp(id, nombre){
  document.getElementById('cxp-proveedor-id-seleccionado').value = id;
  document.getElementById('cxp-buscar-proveedor').value = nombre;
  document.getElementById('cxp-lista-proveedores').style.display = 'none';
}
async function crearProveedorRapidoCxp(nombre){
  if(!nombre.trim()) return;
  const { data, error } = await sb.from('proveedores').insert({ nombre: nombre.trim() }).select().single();
  if(error){ alert('Error creando proveedor: ' + error.message); return; }
  ESTADO.proveedores.push(data);
  seleccionarProveedorCxp(data.id, data.nombre);
}

async function crearCuentaPorPagarManual(){
  const msg = document.getElementById('cxp-manual-msg');
  const proveedorId = document.getElementById('cxp-proveedor-id-seleccionado').value;
  const descripcion = document.getElementById('cxp-descripcion').value.trim();
  const montoTotal = parseFloat(document.getElementById('cxp-monto-total').value);
  const saldoPendiente = parseFloat(document.getElementById('cxp-saldo-pendiente').value);

  if(!proveedorId){ msg.innerHTML = `<div class="msg err">Selecciona o crea un proveedor.</div>`; return; }
  if(!montoTotal || montoTotal <= 0){ msg.innerHTML = `<div class="msg err">Ingresa el monto total de la deuda.</div>`; return; }
  if(isNaN(saldoPendiente) || saldoPendiente < 0 || saldoPendiente > montoTotal){ msg.innerHTML = `<div class="msg err">El saldo pendiente debe ser mayor o igual a 0 y menor o igual al total.</div>`; return; }

  const estado = saldoPendiente <= 0 ? 'pagada_completa' : (saldoPendiente < montoTotal ? 'pagada_parcial' : 'pendiente');

  const { error } = await sb.from('cuentas_por_pagar').insert({
    sede_id: ESTADO.sedeSeleccionada, proveedor_id: proveedorId, descripcion,
    monto_total: montoTotal, saldo_pendiente: saldoPendiente, estado
  });
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }

  msg.innerHTML = `<div class="msg ok">Cuenta por pagar cargada correctamente.</div>`;
  renderPagar();
}

function abrirModalAbonoPagar(cxpId, saldo){
  document.getElementById('modal-contenido').innerHTML = `
    <h3>Registrar abono a proveedor</h3>
    <div id="abono-pagar-modal-msg"></div>
    <div class="form-row"><label>Saldo pendiente actual</label><input type="text" value="${money(saldo)}" disabled></div>
    <div class="form-row"><label>Monto del abono</label><input type="number" id="monto-abono-pagar" min="0.01" max="${saldo}" step="0.01"></div>
    <div class="form-row"><label>Nota (opcional)</label><input type="text" id="nota-abono-pagar"></div>
    ${bloqueMoneda('cxpa')}
    ${bloqueOrigenCaja('cxpa')}
    <div class="acciones">
      <button class="btn secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" onclick="confirmarAbonoPagar('${cxpId}', ${saldo})">Registrar abono</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('activo');
  actualizarMetodosGenerico('cxpa');
}

async function confirmarAbonoPagar(cxpId, saldoActual){
  const msg = document.getElementById('abono-pagar-modal-msg');
  const monto = parseFloat(document.getElementById('monto-abono-pagar').value);
  const nota = document.getElementById('nota-abono-pagar').value.trim();
  if(!monto || monto <= 0 || monto > saldoActual){
    msg.innerHTML = `<div class="msg err">Monto inválido.</div>`; return;
  }
  const pago = datosMonedaCaja('cxpa', monto);
  if(pago.error){ msg.innerHTML = `<div class="msg err">${pago.error}</div>`; return; }

  await sb.from('abonos_por_pagar').insert({ cuenta_por_pagar_id: cxpId, monto, nota, created_by: ESTADO.perfil.id });

  const nuevoSaldo = saldoActual - monto;
  const nuevoEstado = nuevoSaldo <= 0 ? 'pagada_completa' : 'pagada_parcial';
  const { data: cxpActualizada } = await sb.from('cuentas_por_pagar')
    .update({ saldo_pendiente: nuevoSaldo, estado: nuevoEstado }).eq('id', cxpId).select().single();

  if(cxpActualizada?.compra_id){
    const { data: compra } = await sb.from('compras').select('*').eq('id', cxpActualizada.compra_id).single();
    if(compra){
      await sb.from('compras').update({
        monto_pagado: Number(compra.monto_pagado) + monto, estado: nuevoEstado
      }).eq('id', compra.id);
    }
  }

  const { caja, sede_id: sedeCajaId } = await obtenerCajaOrigen('cxpa');
  if(caja){
    await sb.from('movimientos_caja').insert({
      caja_id: caja.id, sede_id: sedeCajaId, tipo: 'egreso_compra', monto,
      moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
      descripcion: nota || 'Abono a cuenta por pagar', referencia_id: cxpId, created_by: ESTADO.perfil.id
    });
    await sb.from('cajas').update({ saldo_actual: Number(caja.saldo_actual) - monto }).eq('id', caja.id);
  }

  cerrarModal();
  renderPagar();
}

async function guardarFilaInventario(productoId){
  const nuevoPrecio = parseFloat(document.getElementById('precio-'+productoId).value);
  const nuevoCosto = parseFloat(document.getElementById('costo-'+productoId).value);
  const inputCantidad = document.getElementById('ajuste-'+productoId).value;

  if(!isNaN(nuevoPrecio) || !isNaN(nuevoCosto)){
    const cambios = {};
    if(!isNaN(nuevoPrecio)) cambios.precio = nuevoPrecio;
    if(!isNaN(nuevoCosto)) cambios.costo = nuevoCosto;
    await sb.from('productos').update(cambios).eq('id', productoId);
  }

  if(inputCantidad !== ''){
    const nuevaCantidad = parseFloat(inputCantidad);
    if(!isNaN(nuevaCantidad) && nuevaCantidad >= 0){
      const { data: existente } = await sb.from('inventario').select('*')
        .eq('sede_id', ESTADO.sedeSeleccionada).eq('producto_id', productoId).maybeSingle();
      if(existente){
        await sb.from('inventario').update({ cantidad: nuevaCantidad, updated_at: new Date().toISOString() }).eq('id', existente.id);
      } else {
        await sb.from('inventario').insert({ sede_id: ESTADO.sedeSeleccionada, producto_id: productoId, cantidad: nuevaCantidad });
      }
      await sb.from('movimientos_inventario').insert({
        sede_id: ESTADO.sedeSeleccionada, producto_id: productoId, tipo: 'ajuste',
        cantidad: nuevaCantidad, created_by: ESTADO.perfil.id
      });
    }
  }

  renderInventario();
}
