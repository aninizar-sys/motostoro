function buscarProductoTraslado(txt){
  const lista = document.getElementById('lista-productos-traslado');
  const t = txt.toLowerCase().trim();
  let results;
  if(!t){
    results = ESTADO.productos
      .filter(p => (ESTADO.inventarioSede[p.id] ?? 0) > 0)
      .sort((a,b) => a.nombre.localeCompare(b.nombre))
      .slice(0, 30);
  } else {
    results = ESTADO.productos.filter(p =>
      p.nombre.toLowerCase().includes(t) || (p.sku||'').toLowerCase().includes(t)
    ).slice(0,15);
  }
  if(!results.length){ lista.innerHTML = `<div>Sin productos con stock en esta sede.</div>`; lista.style.display='block'; return; }
  lista.innerHTML = results.map(p => `
    <div onclick="seleccionarProductoTraslado('${p.id}')">
      ${p.nombre}
      <div class="stock">Stock en esta sede: ${ESTADO.inventarioSede[p.id] ?? 0}</div>
    </div>
  `).join('');
  lista.style.display = 'block';
}

function seleccionarProductoTraslado(productoId){
  const producto = ESTADO.productos.find(p=>p.id===productoId);
  if(!producto) return;
  document.getElementById('producto-id-traslado').value = productoId;
  document.getElementById('buscar-producto-traslado').value = producto.nombre;
  document.getElementById('lista-productos-traslado').style.display = 'none';
  document.getElementById('producto-traslado-seleccionado').textContent = `Stock disponible en esta sede: ${ESTADO.inventarioSede[productoId] ?? 0}`;
  document.getElementById('cantidad-traslado').max = ESTADO.inventarioSede[productoId] ?? 0;
}

async function enviarTraslado(){
  const msg = document.getElementById('traslado-msg');
  const productoId = document.getElementById('producto-id-traslado').value;
  const cantidad = parseInt(document.getElementById('cantidad-traslado').value);
  const sedeDestino = document.getElementById('sede-destino-traslado').value;
  const nota = document.getElementById('nota-traslado').value.trim();

  if(!productoId){ msg.innerHTML = `<div class="msg err">Selecciona un producto.</div>`; return; }
  if(!cantidad || cantidad <= 0){ msg.innerHTML = `<div class="msg err">Ingresa una cantidad válida.</div>`; return; }
  if(!sedeDestino){ msg.innerHTML = `<div class="msg err">Selecciona la sede destino.</div>`; return; }

  const stockActual = ESTADO.inventarioSede[productoId] ?? 0;
  if(cantidad > stockActual){ msg.innerHTML = `<div class="msg err">No hay suficiente stock en esta sede (disponible: ${stockActual}).</div>`; return; }

  const { data: traslado, error } = await sb.from('traslados_inventario').insert({
    producto_id: productoId, cantidad, sede_origen_id: ESTADO.sedeSeleccionada, sede_destino_id: sedeDestino,
    nota: nota || null, created_by: ESTADO.perfil.id
  }).select().single();
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }

  // Se descuenta de inmediato: ya salió físicamente y queda en tránsito hasta que la sede destino confirme
  await sb.from('inventario').update({ cantidad: stockActual - cantidad, updated_at: new Date().toISOString() })
    .eq('sede_id', ESTADO.sedeSeleccionada).eq('producto_id', productoId);
  await sb.from('movimientos_inventario').insert({
    sede_id: ESTADO.sedeSeleccionada, producto_id: productoId, tipo: 'traslado', cantidad,
    nota: `Salida por traslado a ${sedeNombre(sedeDestino)}${nota ? ' — ' + nota : ''} (pendiente de confirmación)`,
    referencia_id: traslado.id, created_by: ESTADO.perfil.id
  });

  msg.innerHTML = `<div class="msg ok">Traslado enviado. Queda pendiente de que ${sedeNombre(sedeDestino)} lo confirme.</div>`;
  renderTraslados();
}

async function aceptarTraslado(trasladoId){
  const { data: traslado } = await sb.from('traslados_inventario').select('*').eq('id', trasladoId).single();
  if(!traslado || traslado.estado !== 'pendiente') return;

  const { data: invRow } = await sb.from('inventario').select('*')
    .eq('sede_id', traslado.sede_destino_id).eq('producto_id', traslado.producto_id).maybeSingle();
  if(invRow){
    await sb.from('inventario').update({ cantidad: Number(invRow.cantidad) + Number(traslado.cantidad), updated_at: new Date().toISOString() }).eq('id', invRow.id);
  } else {
    await sb.from('inventario').insert({ sede_id: traslado.sede_destino_id, producto_id: traslado.producto_id, cantidad: traslado.cantidad });
  }
  await sb.from('movimientos_inventario').insert({
    sede_id: traslado.sede_destino_id, producto_id: traslado.producto_id, tipo: 'traslado', cantidad: traslado.cantidad,

  });
  await sb.from('traslados_inventario').update({

  }).eq('id', trasladoId);

async function rechazarTraslado(trasladoId){
  await resolverTrasladoConDevolucion(trasladoId, 'rechazado');
}
async function cancelarTraslado(trasladoId){
  await resolverTrasladoConDevolucion(trasladoId, 'cancelado');
}

async function resolverTrasladoConDevolucion(trasladoId, nuevoEstado){
  const { data: traslado } = await sb.from('traslados_inventario').select('*').eq('id', trasladoId).single();
  if(!traslado || traslado.estado !== 'pendiente') return;

  // Devolver el stock a la sede de origen
  const { data: invRow } = await sb.from('inventario').select('*')
    .eq('sede_id', traslado.sede_origen_id).eq('producto_id', traslado.producto_id).maybeSingle();
  if(invRow){
    await sb.from('inventario').update({ cantidad: Number(invRow.cantidad) + Number(traslado.cantidad), updated_at: new Date().toISOString() }).eq('id', invRow.id);
  } else {
    await sb.from('inventario').insert({ sede_id: traslado.sede_origen_id, producto_id: traslado.producto_id, cantidad: traslado.cantidad });
  }
  await sb.from('movimientos_inventario').insert({
    sede_id: traslado.sede_origen_id, producto_id: traslado.producto_id, tipo: 'traslado', cantidad: traslado.cantidad,
    nota: nuevoEstado === 'rechazado'
      ? `Traslado rechazado por ${sedeNombre(traslado.sede_destino_id)} — stock devuelto`
      : `Traslado cancelado — stock devuelto`,
    referencia_id: traslado.id, created_by: ESTADO.perfil.id
  });
  await sb.from('traslados_inventario').update({
    estado: nuevoEstado, resuelto_por: ESTADO.perfil.id, resuelto_at: new Date().toISOString()
  }).eq('id', trasladoId);

  renderTraslados();
}

async function abrirCuentaTercero(terceroId){
  const cont = document.getElementById('tercero-detalle');
  cont.innerHTML = `<div class="empty">Cargando...</div>`;

  const { data: movimientos } = await sb.from('movimientos_tercero')
    .select('*').eq('tercero_id', terceroId).eq('sede_id', ESTADO.sedeSeleccionada)
    .order('fecha', {ascending:false}).order('created_at', {ascending:false});

  const entregado = (movimientos||[]).filter(m=>m.tipo==='entrega').reduce((s,m)=>s+Number(m.monto),0);
  const recibido = (movimientos||[]).filter(m=>m.tipo==='recibo').reduce((s,m)=>s+Number(m.monto),0);
  const saldo = entregado - recibido; // positivo = él te debe; negativo = tú le debes

  const grupos = {};
  for(const m of (movimientos||[])){
    const clave = m.moneda + '|' + m.metodo_pago;
    if(!grupos[clave]) grupos[clave] = { moneda: m.moneda, metodo: m.metodo_pago, entregado: 0, recibido: 0 };
    const montoOriginal = Number(m.monto_original ?? m.monto);
    if(m.tipo==='entrega') grupos[clave].entregado += montoOriginal; else grupos[clave].recibido += montoOriginal;
  }
  const gruposOrdenados = Object.values(grupos).sort((a,b)=>(ORDEN_MONEDA[a.moneda]-ORDEN_MONEDA[b.moneda]) || a.metodo.localeCompare(b.metodo));

  const nombreTercero = ESTADO.terceros.find(t=>t.id===terceroId)?.nombre || '';

  cont.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Le has entregado (histórico, ${sedeNombre(ESTADO.sedeSeleccionada)})</div><div class="valor">${money(entregado)}</div></div>
      <div class="kpi"><div class="label">Te ha entregado (histórico)</div><div class="valor">${money(recibido)}</div></div>
      <div class="kpi ${saldo > 0 ? 'rojo' : (saldo < 0 ? 'verde' : '')}">
        <div class="label">Saldo</div>
        <div class="valor">${saldo === 0 ? 'Cuadrado' : (saldo > 0 ? `${nombreTercero} te debe ${money(saldo)}` : `Le debes ${money(Math.abs(saldo))}`)}</div>
      </div>
    </div>

    <div class="card">
      <h3>💱 Por moneda y forma de entrega</h3>
      <table>
        <thead><tr><th>Moneda</th><th>Forma</th><th>Entregado</th><th>Recibido</th><th>Neto</th></tr></thead>
        <tbody>
          ${gruposOrdenados.map(g=>{
            const neto = g.entregado - g.recibido;
            return `<tr>
              <td>${g.moneda}</td>
              <td>${NOMBRES_METODO_ICONO[g.metodo]||''} ${g.metodo}</td>
              <td>${fmtMoneda(g.moneda, g.entregado)}</td>
              <td>${fmtMoneda(g.moneda, g.recibido)}</td>
              <td style="font-weight:600;">${fmtMoneda(g.moneda, neto)}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="5" class="empty">Sin movimientos todavía</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>Registrar movimiento con ${nombreTercero}</h3>
      <div id="mt-msg"></div>
      <div class="form-row">
        <label>¿Qué pasó?</label>
        <select id="mt-tipo">
          <option value="entrega">Yo le entregué dinero a él</option>
          <option value="recibo">Él me entregó dinero a mí</option>
        </select>
      </div>
      <div class="inline-2">
        <div class="form-row" style="margin-bottom:0;"><label>Fecha</label><input type="date" id="mt-fecha" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="form-row" style="margin-bottom:0;"><label>Monto (equivalente USD)</label><input type="number" id="mt-monto" min="0.01" step="0.01" placeholder="0.00"></div>
      </div>
      <div class="form-row" style="margin-top:6px;"><label>¿En qué moneda/forma se hizo la entrega?</label></div>
      ${bloqueMoneda('mt')}
      <div class="form-row"><label>Motivo (opcional)</label><input type="text" id="mt-motivo" placeholder="Ej: pago a proveedor XYZ"></div>
      <div class="form-row"><label>Foto del comprobante (opcional)</label><input type="file" id="mt-foto" accept="image/*"></div>
      <div class="form-row" style="margin-top:4px;">

async function registrarMovimientoTercero(terceroId){
  const msg = document.getElementById('mt-msg');
  const tipo = document.getElementById('mt-tipo').value;
  const fecha = document.getElementById('mt-fecha').value;
  const monto = parseFloat(document.getElementById('mt-monto').value);
  const motivo = document.getElementById('mt-motivo').value.trim();
  const archivoFoto = document.getElementById('mt-foto').files[0];
  const afectaCaja = document.getElementById('mt-afecta-caja').checked;

  if(!fecha){ msg.innerHTML = `<div class="msg err">Selecciona la fecha.</div>`; return; }
  if(!monto || monto <= 0){ msg.innerHTML = `<div class="msg err">Ingresa un monto válido.</div>`; return; }

  const pago = datosMonedaCaja('mt', monto);
  if(pago.error){ msg.innerHTML = `<div class="msg err">${pago.error}</div>`; return; }

  let fotoUrl = null;
  if(archivoFoto){
    msg.innerHTML = `<div class="msg ok">Subiendo comprobante...</div>`;
    try{ fotoUrl = await subirFoto(archivoFoto, 'comprobantes-terceros'); }
    catch(err){ msg.innerHTML = `<div class="msg err">Error subiendo la foto: ${err.message}</div>`; return; }
  }

  const { error } = await sb.from('movimientos_tercero').insert({
    tercero_id: terceroId, sede_id: ESTADO.sedeSeleccionada, tipo, fecha, monto,
    moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
    motivo: motivo || null, foto_url: fotoUrl, afecta_caja: afectaCaja, created_by: ESTADO.perfil.id
  });
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }

  // Solo si se marcó la casilla: reflejar en la caja de esta sede (la mayoría de las cuentas con terceros no pasan por caja)
  if(afectaCaja){
    const { data: caja } = await sb.from('cajas').select('*').eq('sede_id', ESTADO.sedeSeleccionada).single();
    if(caja){
      const tipoMovCaja = tipo === 'entrega' ? 'egreso_entrega_tercero' : 'ingreso_recibo_tercero';
      const nombreTercero = ESTADO.terceros.find(t=>t.id===terceroId)?.nombre || 'tercero';
      await sb.from('movimientos_caja').insert({
        caja_id: caja.id, sede_id: ESTADO.sedeSeleccionada, tipo: tipoMovCaja, monto,
        moneda: pago.moneda, metodo_pago: pago.metodo, monto_original: pago.montoOriginal, tasa_cambio: pago.tasa,
        descripcion: tipo === 'entrega' ? `Entrega a ${nombreTercero}${motivo ? ' — ' + motivo : ''}` : `Recibido de ${nombreTercero}${motivo ? ' — ' + motivo : ''}`,
        created_by: ESTADO.perfil.id
      });
      const nuevoSaldo = tipo === 'entrega' ? Number(caja.saldo_actual) - monto : Number(caja.saldo_actual) + monto;
      await sb.from('cajas').update({ saldo_actual: nuevoSaldo }).eq('id', caja.id);
    }
  }

  abrirCuentaTercero(terceroId);
}

  msg.innerHTML = `<div class="msg ok">Subiendo logo...</div>`;

/* Sube un archivo al bucket de fotos y devuelve la URL pública */
async function subirFoto(file, carpeta){
  const nombreLimpio = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
  const path = `${carpeta}/${Date.now()}-${nombreLimpio}`;
  const { error } = await sb.storage.from('motostoro-fotos').upload(path, file);
  if(error) throw error;
  const { data } = sb.storage.from('motostoro-fotos').getPublicUrl(path);
  return data.publicUrl;
}

            <span onclick="eliminarFotoGaleria('${f.id}', '${productoId}')" style="position:absolute; top:-6px; right:-6px; background:var(--rojo); color:#fff; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer;">✕</span>
          </div>
        `).join('') || `<div class="stock">Sin fotos adicionales</div>`}
      </div>
      <input type="file" id="ep-galeria-file" accept="image/*" multiple onchange="subirFotosGaleria(this, '${productoId}')">

      <h3 style="margin-top:26px;">Colores (opcional — solo si este producto viene en distintos colores)</h3>
      <div id="ep-colores"></div>
    </div>
  `;

  renderColoresEnEdicion(productoId, colores||[]);
}

async function guardarEdicionProducto(productoId){
  const msg = document.getElementById('editar-msg');
  const nombre = document.getElementById('ep-nombre').value.trim();
  const categoria_id = document.getElementById('ep-categoria').value || null;
  const precio = parseFloat(document.getElementById('ep-precio').value) || 0;
  const sku = document.getElementById('ep-sku').value.trim() || null;
  const descripcion = document.getElementById('ep-descripcion').value.trim() || null;
  const etiquetas = document.getElementById('ep-etiquetas').value.split(',').map(t=>t.trim()).filter(Boolean);

  if(!nombre){ msg.innerHTML = `<div class="msg err">El nombre es obligatorio.</div>`; return; }

  const { error } = await sb.from('productos').update({ nombre, categoria_id, precio, sku, descripcion, etiquetas }).eq('id', productoId);
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }
  msg.innerHTML = `<div class="msg ok">Cambios guardados.</div>`;
  renderProductos();
}

async function subirFotoPrincipal(input, productoId){
  const file = input.files[0];
  if(!file) return;
  const msg = document.getElementById('editar-msg');
  msg.innerHTML = `<div class="msg ok">Subiendo foto...</div>`;
  try{
    const url = await subirFoto(file, 'productos');
    await sb.from('productos').update({ imagen_url: url }).eq('id', productoId);
    abrirEditarProducto(productoId);
  } catch(err){
    msg.innerHTML = `<div class="msg err">Error subiendo la foto: ${err.message}</div>`;
  }
}

async function subirFotosGaleria(input, productoId){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  const msg = document.getElementById('editar-msg');
  msg.innerHTML = `<div class="msg ok">Subiendo ${files.length} foto(s)...</div>`;
  try{
    for(const file of files){
      const url = await subirFoto(file, 'productos');
      await sb.from('producto_fotos').insert({ producto_id: productoId, imagen_url: url });
    }
    abrirEditarProducto(productoId);
  } catch(err){
    msg.innerHTML = `<div class="msg err">Error subiendo fotos: ${err.message}</div>`;
  }
}

async function eliminarFotoGaleria(fotoId, productoId){
  await sb.from('producto_fotos').delete().eq('id', fotoId);
  abrirEditarProducto(productoId);
}

/* ---------- Colores (dentro del panel de edición) ---------- */
function renderColoresEnEdicion(productoId, colores){
  const wrap = document.getElementById('ep-colores');
  wrap.innerHTML = `
    <div id="color-msg"></div>
    <div class="inline-3" style="grid-template-columns:1fr 90px 1fr auto;">
      <div class="form-row" style="margin-bottom:0;"><label>Nombre del color</label><input type="text" id="pc-nombre" placeholder="Ej: Rojo, Negro mate"></div>
      <div class="form-row" style="margin-bottom:0;"><label>Muestra</label><input type="color" id="pc-hex" value="#888888" style="height:42px; padding:4px;"></div>
      <div class="form-row" style="margin-bottom:0;"><label>Foto en este color</label><input type="file" id="pc-imagen-file" accept="image/*"></div>
      <button class="btn chico" onclick="agregarColorProducto('${productoId}')">+ Agregar</button>
    </div>

    <table style="margin-top:14px;">
      <thead><tr><th>Color</th><th>Muestra</th><th>Foto</th><th>Disponible</th><th></th></tr></thead>
      <tbody>
        ${colores.map(c=>`
          <tr>
            <td>${c.nombre_color}</td>
            <td><span style="display:inline-block; width:22px; height:22px; border-radius:50%; background:${c.hex_color}; border:1px solid var(--borde); vertical-align:middle;"></span></td>
            <td>${c.imagen_url ? `<img src="${c.imagen_url}" style="width:44px; height:34px; object-fit:cover; border-radius:4px;">` : '—'}</td>
            <td><input type="checkbox" ${c.disponible ? 'checked' : ''} onchange="toggleDisponibleColor('${c.id}', this.checked, '${productoId}')"></td>
            <td><span class="quitar" onclick="eliminarColorProducto('${c.id}', '${productoId}')">Quitar ✕</span></td>
          </tr>
        `).join('') || `<tr><td colspan="5" class="empty">Sin colores cargados — este producto se mostrará sin selector de color en la tienda</td></tr>`}
      </tbody>
    </table>
  `;
}

async function agregarColorProducto(productoId){
  const msg = document.getElementById('color-msg');
  const nombre_color = document.getElementById('pc-nombre').value.trim();
  const hex_color = document.getElementById('pc-hex').value;
  const file = document.getElementById('pc-imagen-file').files[0];

  if(!nombre_color){ msg.innerHTML = `<div class="msg err">Ponle un nombre al color.</div>`; return; }

  let imagen_url = null;
  if(file){
    msg.innerHTML = `<div class="msg ok">Subiendo foto...</div>`;
    try{ imagen_url = await subirFoto(file, 'colores'); }
    catch(err){ msg.innerHTML = `<div class="msg err">Error subiendo la foto: ${err.message}</div>`; return; }
  }

  const { error } = await sb.from('producto_colores').insert({ producto_id: productoId, nombre_color, hex_color, imagen_url });
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }

  abrirEditarProducto(productoId);
}

async function toggleDisponibleColor(colorId, disponible, productoId){
  await sb.from('producto_colores').update({ disponible }).eq('id', colorId);
  abrirEditarProducto(productoId);
}

async function eliminarColorProducto(colorId, productoId){
  await sb.from('producto_colores').delete().eq('id', colorId);
  abrirEditarProducto(productoId);
}
/* =========================================================
   CLIENTES
========================================================= */
async function renderClientes(){
  const cont = document.getElementById('contenido-tab');
  cont.innerHTML = `<div class="empty">Cargando...</div>`;

  const { data: clientes } = await sb.from('clientes').select('*').order('nombre_completo');

  cont.innerHTML = `
    <div class="grid2">
      <div class="card">
        <h3>Nuevo cliente</h3>
        <div id="cliente-msg"></div>
        <div class="form-row"><label>Nombre completo</label><input type="text" id="ncl-nombre"></div>
        <div class="inline-2">
          <div class="form-row"><label>Cédula</label><input type="text" id="ncl-cedula"></div>
          <div class="form-row"><label>Teléfono</label><input type="text" id="ncl-telefono"></div>
        </div>
        <div class="form-row"><label>Dirección</label><input type="text" id="ncl-direccion"></div>
        <button class="btn" onclick="crearCliente()">Crear cliente</button>
      </div>
      <div class="card">
        <h3>Clientes (${(clientes||[]).length})</h3>
        <div class="form-row"><input type="text" id="cl-buscar" placeholder="Buscar cliente por nombre, cédula o teléfono..." oninput="filtrarClientesTabla(this.value)"></div>
        <table>
          <thead><tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th></th></tr></thead>
          <tbody id="tbody-clientes">
            ${(clientes||[]).map(c=>`<tr data-busq="${(c.nombre_completo+' '+(c.cedula||'')+' '+(c.telefono||'')).toLowerCase()}"><td>${c.nombre_completo}</td><td>${c.cedula||'—'}</td><td>${c.telefono||'—'}</td><td><button class="btn chico secundario" onclick='abrirEditarCliente(${JSON.stringify(c)})'>Editar</button></td></tr>`).join('') || `<tr><td colspan="4" class="empty">Sin clientes aún</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function filtrarClientesTabla(texto){
  const t = texto.trim().toLowerCase();
  document.querySelectorAll('#tbody-clientes tr[data-busq]').forEach(tr=>{
    tr.style.display = tr.dataset.busq.includes(t) ? '' : 'none';
  });
}

function abrirEditarCliente(c){
  document.getElementById('modal-contenido').innerHTML = `
    <h3>Editar cliente</h3>
    <div id="modal-cliente-msg"></div>
    <div class="form-row"><label>Nombre completo</label><input type="text" id="ecl-nombre" value="${(c.nombre_completo||'').replace(/"/g,'&quot;')}"></div>
    <div class="inline-2">
      <div class="form-row"><label>Cédula</label><input type="text" id="ecl-cedula" value="${(c.cedula||'').replace(/"/g,'&quot;')}"></div>
      <div class="form-row"><label>Teléfono</label><input type="text" id="ecl-telefono" value="${(c.telefono||'').replace(/"/g,'&quot;')}"></div>
    </div>
    <div class="form-row"><label>Dirección</label><input type="text" id="ecl-direccion" value="${(c.direccion||'').replace(/"/g,'&quot;')}"></div>
    <div class="acciones">
      <button class="btn secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" onclick="guardarEdicionCliente('${c.id}')">Guardar cambios</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('activo');
}

async function guardarEdicionCliente(clienteId){
  const msg = document.getElementById('modal-cliente-msg');
  const nombre_completo = document.getElementById('ecl-nombre').value.trim();
  const cedula = document.getElementById('ecl-cedula').value.trim() || null;
  const telefono = document.getElementById('ecl-telefono').value.trim() || null;
  const direccion = document.getElementById('ecl-direccion').value.trim() || null;

  if(!nombre_completo){ msg.innerHTML = `<div class="msg err">El nombre es obligatorio.</div>`; return; }

  const { error } = await sb.from('clientes').update({ nombre_completo, cedula, telefono, direccion }).eq('id', clienteId);
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }
  cerrarModal();
  await cargarProductosYClientes();
  renderClientes();
}

async function crearCliente(){
  const msg = document.getElementById('cliente-msg');
  const nombre_completo = document.getElementById('ncl-nombre').value.trim();
  const cedula = document.getElementById('ncl-cedula').value.trim() || null;
  const telefono = document.getElementById('ncl-telefono').value.trim() || null;
  const direccion = document.getElementById('ncl-direccion').value.trim() || null;

  if(!nombre_completo){ msg.innerHTML = `<div class="msg err">El nombre es obligatorio.</div>`; return; }

  const { error } = await sb.from('clientes').insert({ nombre_completo, cedula, telefono, direccion });
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }
  msg.innerHTML = `<div class="msg ok">Cliente creado.</div>`;
  renderClientes();
}

async function renderContenidoTienda(){
  const cont = document.getElementById('contenido-tab');
  cont.innerHTML = `<div class="empty">Cargando...</div>`;

  const { data: filas } = await sb.from('contenido_tienda').select('*');
  const valores = {};
  (filas||[]).forEach(f => valores[f.clave] = f.valor);

  const { data: sedes } = await sb.from('sedes').select('*').eq('activa', true).order('nombre');

  cont.innerHTML = `
    <div id="contenido-msg"></div>

    <div class="card">
      <h3>Direcciones de las sedes</h3>
      <div class="stock" style="margin-bottom:12px;">Se muestran en la portada y el pie de página de la tienda pública.</div>
      ${(sedes||[]).map(s => `
        <div class="form-row">
          <label>${s.nombre}</label>
          <input type="text" id="sede-dir-${s.id}" value="${(s.ubicacion||'').replace(/"/g,'&quot;')}" placeholder="Ej: Av. Principal, frente a la plaza, La Fría, Táchira">
        </div>
      `).join('')}
      <button class="btn secundario chico" onclick="guardarDireccionesSedes()">Guardar direcciones</button>
    </div>

    ${CAMPOS_CONTENIDO.map(grupo => `
      <div class="card">
        <h3>${grupo.grupo}</h3>
        ${grupo.campos.map(c => `
          <div class="form-row">
            <label>${c.label}</label>
            ${c.tipo === 'textarea'
              ? `<textarea id="ct-${c.clave}" rows="3" style="width:100%; padding:10px 12px; background:var(--negro3); border:1px solid var(--borde); border-radius:8px; color:var(--blanco); font-size:14px; font-family:inherit;">${valores[c.clave]||''}</textarea>`
              : `<input type="text" id="ct-${c.clave}" value="${(valores[c.clave]||'').replace(/"/g,'&quot;')}">`}
          </div>
        `).join('')}
      </div>
    `).join('')}
    <button class="btn" onclick="guardarContenidoTienda()">Guardar todos los cambios</button>
  `;
}

async function guardarDireccionesSedes(){
  const msg = document.getElementById('contenido-msg');
  for(const sede of ESTADO.sedes){
    const input = document.getElementById('sede-dir-'+sede.id);
    if(!input) continue;
    await sb.from('sedes').update({ ubicacion: input.value.trim() || null }).eq('id', sede.id);
  }
  msg.innerHTML = `<div class="msg ok">Direcciones actualizadas.</div>`;
}

async function guardarContenidoTienda(){
  const msg = document.getElementById('contenido-msg');
  const filas = CAMPOS_CONTENIDO.flatMap(g => g.campos).map(c => ({
    clave: c.clave, valor: document.getElementById('ct-'+c.clave).value
  }));

  const { error } = await sb.from('contenido_tienda').upsert(filas, { onConflict: 'clave' });
  if(error){ msg.innerHTML = `<div class="msg err">Error: ${error.message}</div>`; return; }
  msg.innerHTML = `<div class="msg ok">Textos actualizados. Los cambios ya se ven en la tienda pública, sin necesidad de subir nada a Netlify.</div>`;
}
